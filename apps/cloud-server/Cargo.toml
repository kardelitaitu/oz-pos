[package]
name = "oz-cloud-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless OZ-POS cloud sync server — no Tauri, no WebView, no GUI."

[[bin]]
name = "oz-cloud-server"
path = "src/main.rs"

[dependencies]
oz-api = { workspace = true }
oz-core = { workspace = true }
oz-logging = { workspace = true }
oz-media = { workspace = true }
platform-sync = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tower-http = { workspace = true }
tower = { version = "0.5", features = ["limit"] }
thiserror = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
bytes = "1"
deadpool-postgres = { version = "0.14", features = ["serde"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
lettre = { workspace = true }
console-subscriber = { workspace = true, optional = true }

prometheus = "0.14"

[features]
default = []
console = ["dep:console-subscriber"]

[build-dependencies]
# Embeds the asInvoker application manifest into the Windows exe (see
# build.rs + app.manifest + app.rc). No-op on non-Windows targets.
embed-resource = "2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
serial_test = "3"
