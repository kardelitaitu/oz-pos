<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OZ-POS Admin</title>
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span>OZ-POS Admin</div>
    <div class="topbar-actions">
      <a class="logout db-link" href="https://license.ozpos.my.id/_/" target="_blank" rel="noopener noreferrer">DB</a>
      <button class="logout" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tab-bar">
      <button class="tab tab-active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="tenants">Tenants</button>
      <button class="tab" data-tab="health">Health</button>
    </div>
    <div id="content"><div class="skeleton" style="height:10rem"></div></div>
  </div>

  <div id="modal-root"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
