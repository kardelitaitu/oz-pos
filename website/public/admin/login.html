<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OZ-POS Admin — Sign in</title>
<style>
  :root { --accent:#147efb; --bg:#0b1220; --surface:#121a2c; --surface2:#1a2440; --text:#e6edf7; --muted:#93a4bd; --border:rgba(255,255,255,.09); --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { max-width:22rem; width:100%; padding:2rem; border:1px solid var(--border); border-radius:1rem; background:var(--surface); }
  .logo { display:flex; align-items:center; gap:.5rem; font-weight:700; font-size:1.1rem; margin-bottom:1.5rem; }
  .logo-dot { width:10px; height:10px; border-radius:50%; background:var(--accent); }
  h1 { font-size:1.2rem; margin:0 0 .3rem; }
  .sub { color:var(--muted); font-size:.82rem; margin:0 0 1.5rem; }
  label { display:block; font-size:.82rem; color:var(--muted); margin-bottom:.3rem; }
  input { display:block; width:100%; padding:.55rem .7rem; border-radius:.5rem; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:.9rem; outline:none; margin-bottom:1rem; }
  input:focus { border-color:var(--accent); }
  .btn { display:block; width:100%; padding:.6rem; border-radius:.5rem; border:none; background:var(--accent); color:#fff; font-size:.9rem; font-weight:600; cursor:pointer; transition:opacity .15s; }
  .btn:hover { opacity:.88; }
  .btn:disabled { opacity:.4; cursor:default; }
  .error { color:var(--bad); font-size:.82rem; margin:.5rem 0; }
  .note { color:var(--muted); font-size:.75rem; margin-top:1rem; text-align:center; }
  .back { display:inline-block; color:var(--muted); font-size:.78rem; text-decoration:none; margin-bottom:1rem; }
  .back:hover { color:var(--text); }
  .hidden { display:none; }
  .otp-row { display:flex; gap:.5rem; }
  .otp-row input { flex:1; }
  .otp-btn { white-space:nowrap; padding:.55rem .8rem; border-radius:.5rem; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:.82rem; cursor:pointer; }
  .otp-btn:hover { border-color:var(--accent); }
  .otp-btn:disabled { opacity:.4; cursor:default; }
  .cooldown { color:var(--muted); font-size:.75rem; margin-top:.3rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="logo-dot"></span>OZ-POS</div>
    <h1>Admin Sign in</h1>
    <p class="sub">Sign in to manage tenants, licenses, and system settings</p>

    <div id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="admin@example.com" autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password" />

      <div class="otp-row hidden" id="otp-row">
        <input id="otp-code" type="text" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" />
      </div>

      <div id="error-msg" class="error hidden"></div>

      <button class="btn" id="login-btn" onclick="handleLogin()">Sign in</button>

      <p id="otp-toggle" class="note" style="cursor:pointer" onclick="toggleOtp()">Send a code to my email instead</p>

      <p id="otp-cooldown" class="hidden"></p>
    </div>

    <div id="loading-state" class="hidden">
      <p style="text-align:center;color:var(--muted);font-size:.9rem">Signing in…</p>
    </div>
  </div>

  <script>
    const API = (window.__OZ_CONFIG__ && window.__OZ_CONFIG__.licenseApiUrl) || 'https://license.ozpos.my.id';
    let useOtp = false;
    let otpTimer = null;

    function showError(msg) { const e = document.getElementById('error-msg'); e.textContent = msg; e.classList.remove('hidden'); }
    function hideError() { document.getElementById('error-msg').classList.add('hidden'); }
    function setLoading(l) { document.getElementById('login-form').style.display = l ? 'none' : 'block'; document.getElementById('loading-state').style.display = l ? 'block' : 'none'; }

    function toggleOtp() {
      useOtp = !useOtp;
      document.getElementById('otp-row').classList.toggle('hidden', !useOtp);
      const toggle = document.getElementById('otp-toggle');
      toggle.textContent = useOtp ? 'Sign in with password instead' : 'Send a code to my email instead';
      document.getElementById('login-btn').textContent = useOtp ? 'Send code' : 'Sign in';
      hideError();
      if (useOtp) { document.getElementById('password').style.display = 'none'; } 
      else { document.getElementById('password').style.display = 'block'; }
    }

    function startOtpCooldown() {
      let sec = 60;
      const toggle = document.getElementById('otp-toggle');
      const cd = document.getElementById('otp-cooldown');
      cd.classList.remove('hidden');
      toggle.style.display = 'none';
      cd.textContent = `Resend code in ${sec}s`;
      if (otpTimer) clearInterval(otpTimer);
      otpTimer = setInterval(() => {
        sec--;
        if (sec <= 0) { clearInterval(otpTimer); cd.classList.add('hidden'); toggle.style.display = 'block'; }
        else { cd.textContent = `Resend code in ${sec}s`; }
      }, 1000);
    }

    async function handleLogin() {
      hideError();
      const email = document.getElementById('email').value.trim();
      if (!email) { showError('Enter your email'); return; }

      if (useOtp) {
        const code = document.getElementById('otp-code').value.trim();
        if (!code && document.getElementById('otp-row').classList.contains('hidden')) {
          // First step: request OTP
          setLoading(true);
          try {
            const res = await fetch(API + '/api/v1/web/request-otp', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email })
            });
            const body = await res.json();
            if (res.status === 200) {
              document.getElementById('otp-row').classList.remove('hidden');
              document.getElementById('login-btn').textContent = 'Verify code';
              startOtpCooldown();
              setLoading(false);
              return;
            }
            if (res.status === 429) {
              showLockoutCountdown(body.retry_after || 60);
              setLoading(false);
              return;
            }
            if (res.status === 503) { showError('Email delivery is not configured'); setLoading(false); return; }
            showError(body.error || 'Failed to send code');
          } catch { showError('Could not connect to server'); }
          setLoading(false);
          return;
        }
        // Second step: verify OTP
        if (!code) { showError('Enter the 6-digit code'); return; }
        setLoading(true);
        try {
          const res = await fetch(API + '/api/v1/web/verify-otp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
          });
          const body = await res.json();
          if (res.status === 200 && body.token) {
            window.location.href = '/?token=' + encodeURIComponent(body.token);
            return;
          }
          if (res.status === 429) {
            const body2 = await res.json();
            showLockoutCountdown(body2.retry_after || 60);
            setLoading(false);
            return;
          }
          showError('Invalid or expired code');
        } catch { showError('Could not connect to server'); }
        setLoading(false);
        return;
      }

      // Password login
      const password = document.getElementById('password').value;
      if (!password) { showError('Enter your password'); return; }
      setLoading(true);
      try {
        const res = await fetch(API + '/api/v1/web/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const body = await res.json();
        if (res.status === 200 && body.token) {
          window.location.href = '/?token=' + encodeURIComponent(body.token);
          return;
        }
        if (res.status === 429) {
          const retryAfter = body.retry_after || 60;
          showLockoutCountdown(retryAfter);
          setLoading(false);
          return;
        }
        if (res.status === 429 && body.retry_after === undefined) { showError('Too many attempts — try again later'); setLoading(false); return; }
        showError('Invalid email or password');
      } catch { showError('Could not connect to server'); }
      setLoading(false);
    }

    // ── Lockout countdown (429 with retry_after) ─────────────────
    function showLockoutCountdown(seconds) {
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      let remaining = seconds;
      btn.textContent = `Try again in ${remaining}s`;
      const timer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = useOtp ? 'Send code' : 'Sign in';
          return;
        }
        btn.textContent = `Try again in ${remaining}s`;
      }, 1000);
    }
  </script>
</body>
</html>
