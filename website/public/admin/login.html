<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OZ-POS Admin — Sign in</title>
<link rel="stylesheet" href="/admin/login.css?v=3" />
</head>
<body>
  <div class="card">
    <div class="logo"><span class="logo-dot"></span>OZ-POS</div>
    <h1>Admin Sign in</h1>
    <p class="sub">Sign in to manage tenants, licenses, and system settings</p>

    <!-- Clear Segmented Mode Tabs -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tab-otp" role="tab" aria-selected="true">Email Code</button>
      <button type="button" class="auth-tab" id="tab-password" role="tab" aria-selected="false">Password</button>
    </div>

    <div id="login-form">
      <form id="auth-form">
        <label for="email">Admin Email</label>
        <input id="email" type="email" placeholder="admin@example.com" autocomplete="email" required />

        <!-- Password Mode Input -->
        <div id="password-group" class="hidden">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <!-- Email Code (OTP) Input -->
        <div id="otp-group" class="hidden">
          <label for="otp-code">6-Digit Verification Code</label>
          <div class="otp-row">
            <input id="otp-code" type="text" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="123456" autocomplete="one-time-code" />
          </div>
        </div>

        <div id="success-msg" class="success hidden"></div>
        <div id="error-msg" class="error hidden"></div>

        <button type="submit" class="btn" id="login-btn">Send Verification Code</button>
      </form>

      <p id="otp-cooldown" class="note hidden"></p>
    </div>

    <div id="loading-state" class="hidden">
      <p class="loading-text">Communicating with server…</p>
    </div>
  </div>
  <script src="/admin/login.js?v=3"></script>
</body>
</html>
