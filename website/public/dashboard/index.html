<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OZ-POS Dashboard</title>
<link rel="stylesheet" href="/dashboard/dashboard.css?v=6" />
<script src="/dashboard/theme.js?v=6"></script>
<script src="/admin/admin-utils.js?v=4"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="topbar">
    <a class="back-link" href="https://ozpos.my.id/" title="Back to website" aria-label="Back to website">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="brand"><span class="brand-dot"></span>OZ-POS Dashboard</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="logout" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <h1 class="page-title" id="page-title">Dashboard</h1>
      <p class="page-sub" id="page-sub">Your account at a glance</p>
    </div>
    <div id="content"><div class="skeleton" style="height:8rem"></div><div class="skeleton" style="height:8rem;margin-top:1rem"></div></div>
  </main>

  <script src="/dashboard/dashboard.js?v=6"></script>
</body>
</html>
