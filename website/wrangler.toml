# OZ-POS Website — Cloudflare Workers (static assets)
#
# The site is a pure static build (Astro outputs dist/), served at
# https://ozpos.my.id. Workers static assets honors public/_headers (CSP)
# and public/_redirects (301s) exactly like Pages does.
#
# Deploy (from website/):   npm run build && npx wrangler deploy
# Or via CI:                .github/workflows/website.yml
#
# Alternative: Cloudflare Pages (Git integration) also works — the build
# command/output are the same (`npm run build` → `dist/`); wrangler.toml is
# then ignored and the env vars go in Pages → Settings → Builds.

name = "oz-pos"

# Worker + static assets: worker.ts serves the site from the ASSETS binding
# and exposes /__oz/runtime-config.js backed by the LICENSE_API_URL [vars]
# binding, so the backend URL can change at runtime without rebuilding the
# bundle (the build-time PUBLIC_LICENSE_API_URL stays as the fallback).
main = "worker.ts"
assets = { directory = "./dist", binding = "ASSETS", run_worker_first = true }

# The runtime compatibility date. Bump deliberately (never forward-date):
# `npx wrangler deploy` warns if this is more than a few days old.
compatibility_date = "2026-08-16"

[vars]
# Runtime backend URL — overrides the build-time PUBLIC_LICENSE_API_URL.
# Update this (dashboard → Worker → Settings → Variables, or wrangler.toml)
# when the Northflank host changes; no site rebuild required.
LICENSE_API_URL = "https://license.ozpos.my.id"
CONTACT_WEBHOOK_URL = "https://discord.com/api/webhooks/154258447961xxxxxx"

# PUBLIC_* env vars are baked into the JS at BUILD time (import.meta.env),
# so they are NOT bindings — set them when running `npm run build`:
#   PUBLIC_LICENSE_API_URL=… PUBLIC_PADDLE_CLIENT_TOKEN=… npm run build

[observability.logs]
enabled = true
invocation_logs = true

# ── Routes (ADR #42) ─────────────────────────────────────────────
# dashboard.ozpos.my.id and admin.ozpos.my.id route to this Worker.
# The Worker's hostname dispatch auth-gates them (302 → login when
# no session cookie, placeholder when authenticated).
routes = [
  "dashboard.ozpos.my.id/*",
  "admin.ozpos.my.id/*",
]

