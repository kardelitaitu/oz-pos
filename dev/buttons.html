<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttons — Design Scratchpad</title>
<style>
  /* ── Design tokens (sketch from here) ──────────────── */
  :root {
    --bg: #f4f5f7;
    --bg-surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-muted: #7a8190;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-active: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
    --shadow-md: 0 4px 6px rgba(16,24,40,.07), 0 2px 4px rgba(16,24,40,.06);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #12141a;
    --bg-surface: #1c1f27;
    --border: #2a2e39;
    --text: #e8eaef;
    --text-muted: #8b93a3;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
    --shadow-md: 0 4px 6px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 40px 32px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 1080px;
    margin: 0 auto 32px;
  }
  .page-head h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .page-head p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text);
    border-radius: var(--r-sm);
    padding: 6px 12px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  section {
    max-width: 1080px;
    margin: 0 auto 36px;
  }
  section > h2 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    padding: 20px;
    margin-bottom: 12px;
  }
  .note { font-size: 12px; color: var(--text-muted); margin-top: 10px; line-height: 1.5; }

  /* ── Button archetypes (sketch here) ──────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .06s;
    user-select: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--primary:hover { background: var(--accent-hover); }
  .btn--secondary { background: var(--bg-surface); color: var(--text); border-color: var(--border); }
  .btn--secondary:hover { border-color: var(--text-muted); }
  .btn--ghost { background: transparent; color: var(--text); }
  .btn--ghost:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
  .btn--danger { background: var(--danger); color: #fff; }
  .btn--danger:hover { filter: brightness(1.08); }
  .btn--success { background: var(--success); color: #fff; }
  .btn--warning { background: var(--warning); color: #fff; }
  .btn--icon { padding: 8px; border-radius: 50%; background: transparent; color: var(--text); }
  .btn--icon:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="page-head">
    <div>
      <h1>Buttons — Design Scratchpad</h1>
      <p>Sketch your button system here. Served from dev/buttons.html.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button">Toggle theme</button>
  </div>

  <section>
    <h2>Archetypes</h2>
    <div class="grid">
      <button class="btn btn--primary" type="button">Primary</button>
      <button class="btn btn--secondary" type="button">Secondary</button>
      <button class="btn btn--ghost" type="button">Ghost</button>
      <button class="btn btn--danger" type="button">Danger</button>
      <button class="btn btn--success" type="button">Success</button>
      <button class="btn btn--warning" type="button">Warning</button>
      <button class="btn btn--icon" type="button" aria-label="Icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="btn btn--primary" type="button" disabled>Disabled</button>
    </div>
    <p class="note">Start from these archetypes — tune radii, padding, and shadows as you sketch.</p>
  </section>

  <section>
    <h2>Radii · 8 / 12 / 16</h2>
    <div class="grid">
      <button class="btn btn--primary" style="border-radius: var(--r-sm)" type="button">8px</button>
      <button class="btn btn--primary" style="border-radius: var(--r-md)" type="button">12px</button>
      <button class="btn btn--primary" style="border-radius: var(--r-lg)" type="button">16px</button>
      <button class="btn btn--primary" style="border-radius: 999px" type="button">Pill</button>
      <button class="btn btn--secondary" style="border-radius: 0" type="button">Sharp</button>
    </div>
  </section>

  <section>
    <h2>Sketch space</h2>
    <div class="card" id="sketch" style="min-height: 200px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; align-content: flex-start;"></div>
    <p class="note">Add your own buttons below in the HTML, or drop a button into the sketch space.</p>
  </section>

<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    document.documentElement.dataset.theme =
      document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  /* seed the sketch space with a default row so it isn't empty */
  const sketch = document.getElementById('sketch');
  ['Primary', 'Secondary', 'Ghost'].forEach((label, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + ['btn--primary', 'btn--secondary', 'btn--ghost'][i];
    b.textContent = label;
    sketch.appendChild(b);
  });
</script>
</body>
</html>
