<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="autocomplete" content="off" />
    <title>OZ-POS</title>

    <!-- Favicon & PWA icons (legacy + modern browser support) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10b981" />

    <!-- Restore saved theme before first paint to prevent theme flash. -->
    <script>
      (function() {
        var theme = null;
        try { theme = localStorage.getItem('oz-pos-theme-v4'); } catch(e) {}
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>

    <!-- Localize the boot-splash label before React/Fluent loads.
         Mirrors LocaleContext's storage key for the shipped locales. -->
    <script>
      (function() {
        var el = document.querySelector('[data-oz-locale-text]');
        if (!el) return;
        var locale = null;
        try { locale = localStorage.getItem('oz-pos-locale'); } catch (e) {}
        if (locale === 'id') el.textContent = 'Memuat\u2026';
      })();
    </script>

    <!-- Inline theme base styles so the first paint already has the correct background and text color. -->
    <style>
      :root {
        color-scheme: dark;
        accent-color: #5a9fd4;
      }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="light"] { color-scheme: light; }

      html, body {
        background: radial-gradient(ellipse at 50% -10%, #132540 0%, #07111d 60%, #040a12 100%);
        color: #f0f6ff;
        margin: 0;
        padding: 0;
        min-height: 100dvh;
      }

      /* Light theme override (applied via data-theme attribute or OS preference) */
      html[data-theme="light"] {
        background: linear-gradient(160deg, #f1f5f9 0%, #e9eef4 50%, #e2e8f0 100%);
        color: #1e293b;
      }

      @media (prefers-color-scheme: light) {
        html, body {
          background: linear-gradient(160deg, #f1f5f9 0%, #e9eef4 50%, #e2e8f0 100%);
          color: #1e293b;
        }
      }
      #root { min-height: 100dvh; }
    </style>

    <!-- Boot splash (stage 1): token-first with static fallbacks so the
         very first frame is correct even before tokens.css lands; once
         the theme stylesheet loads the vars resolve to theme values.
         Keep values in sync with the React stage
         (components/AppBootSplash.tsx) and index.tablet.html. -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-5, 1.25rem);
        color: var(--color-fg-secondary, #94a3b8);
        font-family: var(--font-sans, 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif);
        font-size: var(--text-base, 0.875rem);
      }
      html[data-theme="light"] .app-splash { color: #596577; }
      .app-splash__logo { width: 72px; height: 72px; }
      .app-splash__spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--color-primary-soft, rgba(20, 126, 251, 0.15));
        border-top-color: var(--color-primary, #147EFB);
        border-radius: var(--radius-full, 9999px);
      }
      html[data-theme="light"] .app-splash__spinner {
        border-color: rgba(17, 85, 204, 0.10);
        border-top-color: #1155CC;
      }
      .app-splash__label { font-size: var(--text-sm, 0.75rem); }
      @media (prefers-reduced-motion: no-preference) {
        .app-splash__spinner { animation: app-splash-spin 600ms linear infinite; }
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Google Font: Inter (variable weight). Preconnect for fast origin fetch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ── Static boot splash (pre-React stage) ──────────────────────
         Painted by the browser from HTML alone — no JS, no fonts, no
         chunks. Covers the dead white/blank frame between navigation
         start (F5) and React's first commit. React replaces this node
         on mount (ReactDOM.createRoot clears container children), so
         there is no manual removal to leak. Keep the inline styles
         synchronized with .app-splash in themes/components.css and
         index.tablet.html. -->
    <div id="boot-splash" aria-hidden="true">
      <div class="app-splash">
        <!-- Inline logo (ui/public/favicon.svg): inlining guarantees the
             mark paints with the very first frame — an <img src> fetch
             races the first paint on F5 and pops in late. Keep in sync
             with ui/public/favicon.svg. -->
        <svg class="app-splash__logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="oz-splash-bg-d" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2563EB"/>
              <stop offset="100%" stop-color="#6366F1"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="20" fill="url(#oz-splash-bg-d)"/>
          <g fill="#FFFFFF" transform="translate(50,48) scale(1.1)">
            <path d="M0,-30 C8,-30 16,-28.5 23,-25 C30,-21.5 36,-16.5 40,-10
                     C44,-3.5 46,3.5 46,11 C46,18.5 44,25 40,31
                     C36,37 30,41 23,44 C16,47 8,48.5 0,48.5
                     C-8,48.5 -16,47 -23,44 C-30,41 -36,37 -40,31
                     C-44,25 -46,18.5 -46,11 C-46,3.5 -44,-3.5 -40,-10
                     C-36,-16.5 -30,-21.5 -23,-25 C-16,-28.5 -8,-30 0,-30Z"
                  fill-opacity="0.15"/>
            <path d="M0,-28 C-6,-28 -12,-26 -17,-22.5 C-22,-19 -26,-14 -28,-8
                     C-30,-2 -30,4 -28,10 C-26,16 -22,21 -17,24.5
                     C-12,28 -6,30 0,30 C6,30 12,28 17,24.5
                     C22,21 26,16 28,10 C30,4 30,-2 28,-8
                     C26,-14 22,-19 17,-22.5 C12,-26 6,-28 0,-28Z"/>
            <path d="M0,-18 C-4,-18 -7.5,-16.5 -10,-14 C-12.5,-11.5 -14,-8 -14,-4
                     C-14,0 -12.5,3.5 -10,6 C-7.5,8.5 -4,10 0,10
                     C4,10 7.5,8.5 10,6 C12.5,3.5 14,0 14,-4
                     C14,-8 12.5,-11.5 10,-14 C7.5,-16.5 4,-18 0,-18Z"/>
          </g>
          <g fill="#FFFFFF" transform="translate(50,75)">
            <rect x="-18" y="0" width="4" height="18" rx="1.5"/>
            <rect x="-6" y="0" width="4" height="18" rx="1.5"/>
            <rect x="6" y="0" width="4" height="18" rx="1.5"/>
            <rect x="18" y="0" width="4" height="18" rx="1.5"/>
          </g>
        </svg>
        <span class="app-splash__spinner" ></span>
        <span class="app-splash__label" data-oz-locale-text>Loading…</span>
      </div>
    </div>
    <div id="root"></div>
    <!-- Dev-mode Tauri mock (stubbed IPC for browser-only preview).
         Vite alias (dev-mock/tauri-api.ts) handles all invoke() calls.
         Only mockWindows / mockConvertFileSrc need the Tauri mocks
         lib — and those are skipped when __TAURI_INTERNALS__ is locked. -->
    <script type="module">
      import { mockWindows, mockConvertFileSrc } from '@tauri-apps/api/mocks';

      // ── Robust Tauri v2 mock bootstrap ──────────────────────────
      //
      // Tauri v2 defines __TAURI_INTERNALS__ as read-only. The mocks lib
      // needs it to be writable so it can install ipc / convertFileSrc stubs.
      // It also expects a transformCallback stub so channel-based IPC
      // (event listeners, streaming) doesn't crash before the mock is installed.
      //
      // The Vite alias (dev-mock/tauri-api.ts) handles invoke() directly,
      // so the window-level stubs are a best-effort complement.

      const MOCK_INTERNALS_STUB = {
        // Stub transformCallback so code that accesses it before mockWindows
        // runs doesn't throw. Returns a unique ID — unused since invoke() is
        // handled by the Vite alias.
        transformCallback(callback, _once) {
          const id = window.crypto?.randomUUID?.()
            ?? `cb-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          return id;
        },
      };

      let mocksReady = false;
      try {
        delete window.__TAURI_INTERNALS__;
        Object.defineProperty(window, '__TAURI_INTERNALS__', {
          value: MOCK_INTERNALS_STUB,
          writable: true,
          configurable: true,
        });
        mocksReady = true;
      } catch {
        console.warn('[DEV] __TAURI_INTERNALS__ is locked — window mocks skipped');
      }

      if (mocksReady) {
        mockWindows('main');
        mockConvertFileSrc('windows');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
