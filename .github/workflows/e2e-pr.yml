# ── E2E PR Workflow ──────────────────────────────────────────────────
#
# Runs the E2E test suite on Pull Requests targeting main.
# Uses the new `npm run e2e` runner (scripts/run-e2e.mjs) which handles
# Docker setup, Vite startup, Playwright, and cleanup automatically.
#
# Two triggers:
#   • pull_request — runs on every PR commit (lightweight: 1 shard)
#   • workflow_dispatch — manual re-run from Actions tab
#
# Differences from the main-branch E2E job (in ci.yml):
#   • Single shard (not 3-way) — faster feedback, adequate for PRs
#   • Uses `--changed-only` to run only changed spec files when possible
#   • No Docker image push to GHCR
#   • No Rust toolchain needed (uses pre-built Docker images)
#
# Target: < 6 min on a cache hit, < 10 min on cold start.

name: E2E (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - 'scripts/run-e2e.mjs'
      - 'docker-compose.e2e.yml'
      - 'Dockerfile.server'
      - 'apps/license-server/**'
  workflow_dispatch:
    inputs:
      specs:
        description: 'Spec files to run (space-separated, relative to ui/)'
        required: false
        default: ''
      headed:
        description: 'Run with browser visible (true/false)'
        required: false
        default: 'false'
      changed_only:
        description: 'Only run changed spec files (true/false)'
        required: false
        default: 'true'

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e-pr:
    name: E2E (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for --changed-only (git merge-base)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install UI dependencies
        run: cd ui && npm ci --no-audit --no-fund

      - name: Verify esbuild binary
        run: |
          cd ui
          node -e "try { require('esbuild'); console.log('esbuild OK'); } catch (e) { console.error('esbuild missing', e); process.exit(1); }"

      - name: Install Playwright browsers
        run: cd ui && npx playwright install chromium --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E cloud server image (with GHA cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          load: true
          tags: e2e-cloud-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build E2E license server image (with GHA cache)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/license-server
          file: ./apps/license-server/Dockerfile
          load: true
          tags: e2e-license-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E tests
        env:
          OZ_API_SECRET: ci-test-secret
          VITE_STARTUP_TIMEOUT: 120000
          VITE_LOG_LEVEL: info
        run: |
          cd ui

          # Build the CLI args
          ARGS=""

          # workflow_dispatch: use inputs if provided
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.headed }}" == "true" ]]; then
              ARGS="$ARGS --headed"
            fi
            if [[ "${{ github.event.inputs.changed_only }}" == "true" ]]; then
              ARGS="$ARGS --changed-only"
            fi
            if [[ -n "${{ github.event.inputs.specs }}" ]]; then
              ARGS="$ARGS ${{ github.event.inputs.specs }}"
            fi
          else
            # pull_request: always use --changed-only
            ARGS="$ARGS --changed-only"
          fi

          echo "Running: npm run e2e -- ${ARGS}"
          npm run e2e -- ${ARGS}

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ui/e2e-results/
          retention-days: 7

      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: ui/test-results/
          retention-days: 7
