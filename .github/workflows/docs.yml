# ── Documentation Pipeline ────────────────────────────────────────────
#
# Generates cargo doc for the entire workspace and deploys to GitHub
# Pages. Runs on every push to main + manual trigger.
#
# Excludes the two Tauri app binaries (oz-pos-app, oz-pos-tablet) since
# their docs are not useful to library consumers. `platform-startup`
# (a workspace member that depends on tauri) IS documented, so the
# install step pulls in the gtk3/webkit2gtk system libraries that
# tauri's gdk-sys build script requires. Core library documentation for
# oz-core, oz-hal, oz-payment, platform-* etc. is generated with
# `--document-private-items` for internal developer use.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'foundation/**'
      - 'platform/**'
      - 'modules/**'
      - 'Cargo.toml'
      - 'docs/**'
      - 'scripts/build-docs.*'
      - '.github/workflows/docs.yml'
  # AUDIT-27 CI-08: documentation-only PRs touching docs/ci-pipeline.md
  # (or any workflow it catalogs) run the SAME drift gate as ci.yml, so
  # a stale job matrix can never be merged via the docs path.
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/**'
      - 'scripts/verify-ci-docs-drift.py'
      - 'scripts/check.sh'
      - 'scripts/check-ui.mjs'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # AUDIT-27 CI-08: fail-closed drift gate mirroring ci.yml's ci-docs-drift.
  # Pure python — no toolchain deps, so it stays fast. build-and-deploy
  # waits on it so the published Pages site never carries a stale job
  # matrix.
  ci-docs-drift:
    name: CI Docs Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs/ci-pipeline.md matches workflows + local runners
        run: python3 scripts/verify-ci-docs-drift.py

  # AUDIT-30 docs-build-pr-validation: cargo doc BUILD validation on PRs.
  # Previously the doc build lived only inside the push-only deploy job,
  # so a docs- or workflow-touching PR never compiled the docs — a broken
  # cargo doc (or a native-dep build-script failure) passed every PR check
  # and only surfaced after merge. This job mirrors build-and-deploy's
  # build steps WITHOUT the `environment: github-pages` block (that env
  # rejects PR refs fail-closed), so docs PRs get a real compile signal.
  # The deploy job keeps its own build (job artifacts don't cross jobs;
  # sccache makes the push-side rebuild cheap). Runs on PRs only — main
  # push validation is already the deploy job's gate.
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-always: true

      - uses: mozilla/sccache-action@v0.0.10

      - name: Install system dependencies
        # Two native build-script requirements must be satisfied even with
        # `--no-deps`, because the workspace members themselves still
        # compile to generate their docs:
        #   • `platform-startup` depends on `tauri`, which on Linux pulls
        #     in `gdk-sys` (via gtk3); `gdk-sys` requires `gdk-3.0.pc`,
        #     provided by `libgtk-3-dev`.
        #   • `oz-hal` depends on `serialport`, which pulls in `libudev`
        #     (libudev-sys); its build script requires `libudev.pc`,
        #     provided by `libudev-dev`. Without it the build script
        #     panics: "Package libudev was not found in the pkg-config
        #     search path".
        # This mirrors the install step in .github/workflows/nightly.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libudev-dev

      - name: Generate cargo doc
        run: |
          cargo doc \
            --workspace \
            --no-deps \
            --document-private-items \
            --exclude oz-pos-app \
            --exclude oz-pos-tablet

          # Copy the existing doc hub assets alongside cargo doc output.
          # The cargo doc workspace index (target/doc/index.html) is
          # preserved — it lists all crates with inter-crate navigation.
          mkdir -p target/doc/html
          cp -r docs/html/* target/doc/html/ 2>/dev/null || true

      - name: sccache stats
        run: sccache --show-stats

  build-and-deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    # AUDIT-29 docs-deploy-pr-isolation: the github-pages environment gates
    # deployments to repository-protected branches only (refs/heads/main).
    # PR-triggered runs use refs/pull/N/merge, which the protection rule
    # rejects with "Branch X is not allowed to deploy to github-pages due to
    # environment protection rules." — fail-closed and deterministic on every
    # docs PR. Pushing the build forward on PRs gives no early-warning signal
    # (cargo doc is unrelated to drift), so we skip the deploy attempt entirely
    # on non-push events. The `ci-docs-drift` job above still runs on PRs (no
    # `environment:` block → unconstrained), so a docs-touching PR still
    # verifies its matrix against the manifest before merge. The `build-docs`
    # job (AUDIT-30) additionally compiles the docs on PRs for a real
    # build signal.
    if: github.event_name == 'push'
    needs: ci-docs-drift
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-always: true

      - uses: mozilla/sccache-action@v0.0.10

      - name: Install system dependencies
        # Two native build-script requirements must be satisfied even with
        # `--no-deps`, because the workspace members themselves still
        # compile to generate their docs:
        #   • `platform-startup` depends on `tauri`, which on Linux pulls
        #     in `gdk-sys` (via gtk3); `gdk-sys` requires `gdk-3.0.pc`,
        #     provided by `libgtk-3-dev`.
        #   • `oz-hal` depends on `serialport`, which pulls in `libudev`
        #     (libudev-sys); its build script requires `libudev.pc`,
        #     provided by `libudev-dev`. Without it the build script
        #     panics: "Package libudev was not found in the pkg-config
        #     search path".
        # This mirrors the install step in .github/workflows/nightly.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libudev-dev

      - name: Generate cargo doc
        run: |
          cargo doc \
            --workspace \
            --no-deps \
            --document-private-items \
            --exclude oz-pos-app \
            --exclude oz-pos-tablet

          # Copy the existing doc hub assets alongside cargo doc output.
          # The cargo doc workspace index (target/doc/index.html) is
          # preserved — it lists all crates with inter-crate navigation.
          mkdir -p target/doc/html
          cp -r docs/html/* target/doc/html/ 2>/dev/null || true

      - name: sccache stats
        run: sccache --show-stats

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (if the repo has it off) and configure the site to
          # be built from GitHub Actions. Without this, configure-pages
          # fails with "Get Pages site failed: Not Found" when the repo has
          # never had Pages enabled. The workflow already grants pages:write.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
