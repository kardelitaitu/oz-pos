<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDS v2 — Kitchen Display Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Touch-screen modern scrollbar: thin, transparent, no visible track */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  /* Light theme: darker thumb so it stays visible on light backgrounds */
  .kds-screen.light ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }
  .kds-screen.light ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.35); }
  .kds-screen.light * { scrollbar-color: rgba(0,0,0,0.2) transparent; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 0;
    margin: 0;
    /* page zoom > 100% scales the screen beyond the viewport — without
       this, the body grows and spawns a page scrollbar. The screen
       itself already clips (overflow:hidden); the body must too. */
    overflow: hidden;
    /* text rendering: hint the engine to prefer legibility. -webkit-font-
       smoothing only applies on macOS; on Windows the key fix is not
       compositing cards (see .kds-card) so ClearType stays enabled. */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ── THEME (dark default, light override via .light class) ── */
  .kds-screen {
    --bg: #0f0f14;
    --bg-top: #1a1a25;
    --bg-surface: #181825;
    --bg-tabs: rgba(255,255,255,0.06);
    --bg-tab-active: rgba(255,255,255,0.14);
    --bg-hover: rgba(255,255,255,0.08);
    --bg-active: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.15);
    --text: #e6e6e6;
  }
  .kds-screen.light {
    --bg: #f2f2f5;
    --bg-top: #ffffff;
    --bg-surface: #ffffff;
    --bg-tabs: rgba(0,0,0,0.06);
    --bg-tab-active: rgba(0,0,0,0.12);
    --bg-hover: rgba(0,0,0,0.06);
    --bg-active: rgba(0,0,0,0.1);
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1a1a1a;
  }

  /* ── Screen: 3-flex ─────────────────────────────── */
  .kds-screen {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
    background: var(--bg);
    overflow: hidden;
    user-select: none;
  }

  /* ── TOPMENU ────────────────────────────────────── */
  .kds-topmenu {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 10px 18px;
    background: var(--bg-top);
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .kds-topmenu-left { display: flex; align-items: center; gap: 10px; color: var(--text); justify-self: start; }
  .kds-filter { position: relative; display: flex; align-items: center; }
  .kds-filter-panel {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 180px;
    background: var(--bg-top); border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 6px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: kds-drop-in 0.18s ease-out;
    transform-origin: top center;
  }
  @keyframes kds-drop-in {
    from { opacity: 0; transform: translateY(-6px) scaleY(0.95); }
    to { opacity: 1; transform: translateY(0) scaleY(1); }
  }
  .kds-filter-option {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px;
    color: var(--text); opacity: 0.85; transition: all 0.1s;
    white-space: nowrap;
    /* no icon, no count — just the category name */
  }
  /* hover bg only on unselected options — an ACTIVE (blue) option keeps
     its colour; hover there is just the gentle pop on the label */
  .kds-filter-option:not(.checked):hover { background: rgba(255,255,255,0.07); }
  .kds-filter-option:hover > span { animation: kds-btn-pop 0.45s ease-out; transform-origin: center; }
  .kds-filter-option.checked { background: #3b82f6; color: #fff; opacity: 1; }
  /* view-mode row (All / Processed) above the category grid */
  .kds-filter-modes { display: flex; gap: 4px; margin-bottom: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  /* Up to 3 columns; each button is only as wide as its label (max-content) */
  .kds-filter-grid { display: grid; grid-template-columns: repeat(3, max-content); gap: 3px; justify-content: start; }
  .kds-tabs { position: relative; display: flex; gap: 4px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 2px; justify-self: center; }
  /* light theme: white track is invisible on the white topmenu → darken */
  .kds-screen.light .kds-tabs { background: rgba(0,0,0,0.1); }
  .kds-tab-indicator {
    position: absolute; top: 2px; left: 2px; bottom: 2px;
    background: #3b82f6; border-radius: 8px;
    transition: left 0.28s cubic-bezier(0.33, 1, 0.68, 1), width 0.28s cubic-bezier(0.33, 1, 0.68, 1);
    pointer-events: none;
    transform-origin: center;
  }
  .kds-tab {
    position: relative; z-index: 1;
    padding: 5px 16px; border-radius: 8px; border: none;
    background: transparent; color: var(--text); opacity: 0.5; cursor: pointer; font-size: 13px;
    font-weight: 600; /* constant weight → no text reflow on active */
    line-height: 18px; /* fixed line-height — text (13px) and count (12px)
       share the same box height, so align-items: center aligns both
       perfectly; without this the default line-heights differ and the
       baselines drift */
    transition: opacity 0.15s;
    /* flex: children (label + count) become flex items, so the
       hover scale() animation actually applies (transforms don't
       work on plain inline spans) */
    display: inline-flex; align-items: center; gap: 5px;
    /* ⚠ REMEMBER: any button whose children you scale() on hover must
       be a flex/grid container (or children display:inline-block).
       See the .kds-btn helper header for the same rule. */
  }
  .kds-tab:hover { opacity: 0.8; }
  .kds-tab:hover > span { animation: kds-btn-pop 0.45s ease-out; transform-origin: center; }
  .kds-tab.active { opacity: 1; color: #fff; }
  .kds-tab.active .kds-tab-count { opacity: 0.8; }
  .kds-tab-count { opacity: 0.6; font-size: 13px; }
  .kds-tab.active .kds-tab-count { opacity: 0.8; }
  .kds-topmenu-right { display: flex; align-items: center; gap: 8px; position: relative; justify-self: end; }

  /* ── BUTTON HELPER (.kds-btn) ─────────────────────
     State model:
       default  → background: var(--btn-bg)
       :hover   → background: var(--btn-hover)
       :active  → background: var(--btn-active)  (pressed)
       .is-active (state class, not :active) → var(--btn-state)
     Variants set the tokens; the base class owns geometry + states only.
     ⚠ IMPORTANT: inline-flex is required — transforms (scale pop)
       do NOT work on plain inline children. The hover pop animation
       targets direct children (> *), which must be flex/grid items
       for the transform to render.
     Modifiers:
       --stack  → grid-stacked labels (width = widest label)
       --icon   → square icon button (back, hamburger)
       --filter → caret + 'all' blue state (category dropdown trigger)
       --muted  → translucent (tabs, idle controls) */
  .kds-btn {
    --btn-bg: #3b82f6;        /* default colour */
    --btn-fg: #fff;
    --btn-hover: #2563eb;     /* normal hover (lighter blue) */
    --btn-active: #1d4ed8;    /* pressed */
    --btn-state: #3b82f6;     /* persistent .is-active state */
    --btn-state-hover: #ef4444; /* hover while in state */
    padding: 3px 16px; border-radius: 8px; border: none;
    background: var(--btn-bg); color: var(--btn-fg); opacity: 1;
    cursor: pointer; font-size: 13px; font-weight: 600;
    transition: background 0.15s, color 0.15s, transform 0.06s;
    white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
    /* Heights are border-box (see * rule): min-height 22px → 22px total.
       Text buttons sit at 22px; icon buttons are 32×32; the shift
       variant overrides min-height to 28px to match the tab pill. */
    min-height: 22px;
  }
  .kds-btn:hover { background: var(--btn-hover); }
  .kds-btn:active { background: var(--btn-active); transform: translateY(1px); }
  .kds-btn.is-active { background: var(--btn-state); }
  .kds-btn.is-active:hover { background: var(--btn-state-hover); }
  /* gentle hover pop on any direct text/icon child */
  @keyframes kds-btn-pop {
    0% { transform: scale(1); }
    30% { transform: scale(0.95); }
    55% { transform: scale(1.1); }
    80% { transform: scale(0.97); }
    100% { transform: scale(1); }
  }
  .kds-btn:hover > * { animation: kds-btn-pop 0.45s ease-out; transform-origin: center; }

  /* --stack: labels share one grid cell → width = widest label */
  .kds-btn--stack { display: inline-grid; grid-template-areas: 'l'; align-items: center; justify-items: center; }
  .kds-btn--stack > span { grid-area: l; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
  .kds-btn--stack > span.visible { opacity: 1; }
  .kds-btn--stack:hover > span.visible { animation: kds-btn-pop 0.45s ease-out; transform-origin: center; }

  /* --icon: square transparent icon button (back, hamburger, any SVG).
     Stays 32×32 — bigger tap target; text buttons match the 28px tab
     slider instead. */
  .kds-btn--icon {
    width: 32px; height: 32px; padding: 0;
    background: transparent; color: var(--text); opacity: 0.7;
  }
  .kds-btn--icon:hover { background: rgba(255,255,255,0.08); opacity: 1; }
  .kds-btn--icon:active { background: rgba(255,255,255,0.12); transform: translateY(1px); }
  .kds-btn--icon svg { width: 18px; height: 18px; transform-box: fill-box; }

  /* --filter: caret rotation + blue 'all' state — height matches the
     28px shift button and tab slider pill */
  .kds-btn--filter { min-height: 28px; --btn-bg: rgba(255,255,255,0.06); --btn-fg: var(--text); --btn-hover: rgba(255,255,255,0.08); --btn-active: rgba(255,255,255,0.12); }
  .kds-btn--filter.all { background: #3b82f6; color: #fff; opacity: 1; }
  .kds-btn--filter.all .caret { opacity: 0.7; }
  .kds-btn--filter .caret { opacity: 0.5; display: inline-flex; align-items: center; transition: transform 0.2s; }
  .kds-btn--filter .caret svg { width: 18px; height: 18px; }
  .kds-btn--filter.open .caret { transform: rotate(180deg); }

  /* Variant: start/end shift — blue rest; GREEN hover when starting
     (not in shift), RED hover when stopping (in shift, destructive).
     The .is-active state decides which hover colour applies.
     min-height: 28px — the blue backdrop matches the Open/Completed
     tab slider pill (28px). Everything is border-box, so this IS the
     final height (22px base + this override). */
  .kds-btn--shift {
    min-height: 28px;
    --btn-hover: #22c55e;      /* starting → green */
    --btn-active: #16a34a;
    --btn-state: #3b82f6;
    --btn-state-hover: #ef4444; /* stopping → red */
  }
  /* Variant: plain/muted (tabs, filter when not active) */
  .kds-btn--muted {
    --btn-bg: rgba(255,255,255,0.06);
    --btn-fg: var(--text);
    --btn-hover: rgba(255,255,255,0.08);
    --btn-active: rgba(255,255,255,0.12);
    --btn-state: rgba(255,255,255,0.14);
    --btn-state-hover: rgba(255,255,255,0.18);
  }

/* Hamburger panel — same drop-in animation as the filter dropdown.
   Radius scale (4-based): panel 16 · cards 12 · controls 8 — one
   consistent rhythm across the whole panel. */
  .kds-hamburger-panel {
    position: absolute; top: calc(100% + 6px); right: 0; width: 375px;
    overflow: hidden;
    background: var(--bg-top); border: 1px solid var(--border-strong); border-radius: 16px;
    padding: 0; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: kds-drop-in 0.18s ease-out;
    transform-origin: top right;
  }
  /* scrollable body — the floating close overlaps the section eyebrow's
     right side (short left-aligned text, no collision). No dedicated
     top padding — the panel starts tight. */
  .kds-panel-body {
    max-height: calc(100vh - 80px);
    overflow-y: auto; overflow-x: hidden;
    padding: 14px;
    scrollbar-width: thin;
  }
  /* floating dismiss button — sits in the top-right corner, overlapping
     the eyebrow band. The panel's border-radius keeps it contained. */
  .kds-panel-close {
    position: absolute; top: 6px; right: 8px; z-index: 10;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text); opacity: 0.8;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .kds-panel-close:hover { background: var(--border); opacity: 1; }
  .kds-panel-close svg { width: 13px; height: 13px; }
  .kds-panel-section { margin-bottom: 14px; }
  .kds-panel-section:last-child { margin-bottom: 0; }
  .kds-panel-section h3 { font-size: 10px; font-weight: 600; color: var(--text); opacity: 0.5; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  /* section head row: eyebrow + theme tag (which config is being edited) */
  .kds-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .kds-section-head h3 { margin-bottom: 0; }
  .kds-theme-tag {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text); opacity: 0.45;
    padding: 2px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-surface);
  }
  /* setting card: one boxed group; rows inside are separated by hairline
     dividers. ONE architecture for every group — Display, Behaviour,
     Card Colours all use it. */
  .kds-setting-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .kds-setting-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 12px;
  }
  .kds-setting-row + .kds-setting-row { border-top: 1px solid var(--border); }
  .kds-setting-label { font-size: 12px; font-weight: 600; color: var(--text); opacity: 0.85; }
  .kds-setting-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kds-setting-caption { font-size: 10px; color: var(--text); opacity: 0.45; }
  /* visible keyboard focus anywhere inside the panel — buttons only,
     the hex/native inputs have their own focus treatment */
  .kds-panel-body button:focus-visible {
    outline: 2px solid #3b82f6; outline-offset: 1px;
  }
  /* P4: visible keyboard focus across the whole screen (tabs, item
     rows, category headers, status buttons, filter options, inputs) */
  .kds-screen button:focus-visible,
  .kds-screen [role="option"]:focus-visible,
  .kds-screen input:focus-visible {
    outline: 2px solid #3b82f6; outline-offset: 1px;
  }

  /* Inline colour swatches (in the hamburger panel) —
     accordion groups: head toggles, body collapses. One open at a time. */
  .kds-acc-head {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 11px 12px;
    background: transparent; border: none; cursor: pointer;
    font-size: 12px; font-weight: 600; color: var(--text); opacity: 0.85;
    font-family: inherit;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .kds-acc-head:hover { background: var(--border); }
  .kds-acc-head:not(:first-child) { border-top: 1px solid var(--border); }
  .kds-acc-head svg { width: 12px; height: 12px; opacity: 0.5; transition: transform 0.2s; }
  .kds-acc-head[aria-expanded="true"] svg { transform: rotate(180deg); }
  .kds-acc-body { padding: 6px 12px 12px; }
  .kds-color-group { margin-bottom: 12px; }
  .kds-color-group:last-child { margin-bottom: 0; }
  .kds-color-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .kds-color-head label { font-size: 12px; color: var(--text); opacity: 0.85; flex: 1; min-width: 0; }
  /* native colour picker chip: shows the current colour, click → OS picker */
  .kds-native {
    width: 32px; height: 32px; padding: 0; border: 1px solid var(--border-strong);
    border-radius: 8px; background: transparent; cursor: pointer; flex-shrink: 0;
  }
  .kds-native::-webkit-color-swatch-wrapper { padding: 3px; }
  .kds-native::-webkit-color-swatch { border-radius: 5px; border: none; }
  .kds-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .kds-swatch {
    width: 32px; height: 32px; padding: 0; appearance: none;
    border-radius: 8px; border: 2px solid transparent; cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
  }
  .kds-swatch:hover { transform: scale(1.12); }
  .kds-swatch.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--bg-top) inset; }
  .kds-hex-input {
    width: 60px; height: 32px; padding: 0 8px; border-radius: 8px; font-size: 11px;
    border: 1px solid var(--border-strong); background: var(--bg-surface);
    color: var(--text); opacity: 0.8; text-align: center; font-family: ui-monospace, monospace;
    transition: all 0.15s; flex-shrink: 0;
  }
  .kds-hex-input:focus { outline: none; border-color: #3b82f6; opacity: 1; }
  /* footer action inside the Card Colours card — scoped, labelled, theme-aware */
  .kds-reset-btn {
    width: 100%; padding: 10px 12px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: transparent; border: none; border-top: 1px solid var(--border);
    color: var(--text); opacity: 0.65; font-size: 11px; font-weight: 600;
    font-family: inherit;
    cursor: pointer; transition: all 0.15s;
  }
  .kds-reset-btn:hover { background: var(--border); opacity: 1; }
  .kds-reset-btn svg { width: 12px; height: 12px; opacity: 0.6; }

  /* Theme toggle — same slider pattern as the Open/Completed tabs:
   a blue pill indicator slides between Dark/Light with a
   squash-and-stretch (scale) animation. Options are sun/moon glyphs. */
  .kds-theme-toggle {
    position: relative; display: flex; gap: 4px;
    background: rgba(255,255,255,0.06); border-radius: 8px; padding: 3px;
    border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* light theme: darken the track so the slider is visible */
  .kds-screen.light .kds-theme-toggle { background: rgba(0,0,0,0.08); }
  .kds-theme-indicator {
    position: absolute; top: 3px; left: 3px; bottom: 3px;
    background: #3b82f6; border-radius: 6px;
    transition: left 0.28s cubic-bezier(0.33, 1, 0.68, 1), width 0.28s cubic-bezier(0.33, 1, 0.68, 1);
    pointer-events: none;
    transform-origin: center;
  }
  .kds-theme-option {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 5px 9px; border-radius: 6px; border: none;
    background: transparent; color: var(--text); opacity: 0.5;
    transition: opacity 0.15s;
  }
  .kds-theme-option svg { width: 14px; height: 14px; }
  .kds-theme-option:hover { opacity: 0.8; }
  .kds-theme-option.on { opacity: 1; color: #fff; }

  /* Display scale (global page) + Card size — each a row inside the
     Display card: label left, − / value / + stepper right. */
  .kds-zoom-row { display: flex; align-items: center; gap: 4px; }
  .kds-zoom-btn { width: 32px; height: 32px; padding: 0; font-size: 14px; font-weight: 600; border-radius: 8px; }
  /* the value is a clickable reset-to-100% button — underline on hover
     makes the reset affordance discoverable without a tooltip */
  .kds-zoom-value {
    flex: 1; height: 32px; padding: 0 8px; text-align: center;
    font-size: 12px; font-weight: 600; color: var(--text); opacity: 0.85;
    cursor: pointer; border-radius: 8px; min-width: 44px;
  }
  .kds-zoom-value:hover { opacity: 1; background: var(--border); text-decoration: underline; text-underline-offset: 3px; }

  /* ── MAIN ───────────────────────────────────────── */
  .kds-main {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 14px;
    /* JS masonry: .kds-col columns grow in height, so vertical scroll
       works (CSS columns can't scroll inside a fixed-height box). */
    display: flex; flex-direction: row; align-items: flex-start;
    gap: 12px;
  }
  .kds-main > .kds-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .kds-main > .kds-col > .kds-card { width: 100%; max-width: 100%; }
  .kds-main.empty { align-items: center; justify-content: center; }
  .kds-main.empty > .kds-empty { flex: initial; align-self: auto; }
  .kds-main.completed-view { display: flex; flex-direction: column; }
  .kds-main.completed-view > .kds-completed-card { margin-bottom: 8px; }

  /* Tab slide transition */
  @keyframes kds-slide-in-right { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes kds-slide-in-left { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
  .kds-main.slide-right { animation: kds-slide-in-right 0.25s ease-out; }
  .kds-main.slide-left { animation: kds-slide-in-left 0.25s ease-out; }
  .kds-empty {
    /* centered in the middle of the main area (both axes): flex:1 grows
       on the main axis, align-self:stretch fills the cross axis in row
       AND column layouts */
    display: flex; align-items: center; justify-content: center;
    flex: 1; align-self: stretch;
    color: var(--text); opacity: 0.35; font-size: 15px;
  }

  /* ── ORDER CARD: 3-flex ─────────────────────────── */
  .kds-card {
    display: flex; flex-direction: column;
    background: var(--bg-surface); border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border); min-height: 0; height: fit-content;
    width: 100%; max-width: 100%;
    transition: border-color 0.2s; color: var(--text);
    /* NOTE: no will-change:transform here — promoting every card to its
       own compositor layer permanently disables subpixel (ClearType)
       antialiasing on Windows, making text look thin/blurry. It is only
       applied during FLIP moves (.kds-moving) when actually animating. */
  }
  .kds-card:hover { border-color: var(--border-strong); }

  /* Card lifecycle animations (spawn / gone / move) via FLIP.
     SOTA motion language (Material):
       Enter  → decelerate  cubic-bezier(0.2, 0, 0, 1)  fast start, slow settle
       Exit   → accelerate  cubic-bezier(0.4, 0, 1, 1)  slow start, fast leave
       Move   → standard    cubic-bezier(0.4, 0, 0.2, 1) smooth glide
     Rhythm: 300ms spawn / 250ms leave / 350ms move.
     Directionality: spawn ARRIVES (rises in from below, expands),
     leave DEPARTS (drops away, compresses) — distinct personalities. */
  @keyframes kds-card-in {
    from { opacity: 0; transform: scale(0.9) translateY(14px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .kds-card-spawn { animation: kds-card-in 0.3s cubic-bezier(0.2, 0, 0, 1); }
  .kds-card.leaving {
    pointer-events: none;
    animation: kds-card-out 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
  }
  @keyframes kds-card-out {
    from { opacity: 1; transform: scale(1) translateY(0); }
    to { opacity: 0; transform: scale(0.85) translateY(10px); }
  }
  .kds-moving { will-change: transform; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important; }
  /* reduced motion: the in-app toggle (body.no-anim) is the single
     control. NO prefers-reduced-motion media query here — an OS-level
     setting was silently killing the animations even when the user
     explicitly turned them on in the hamburger. */
  body.no-anim .kds-card-spawn, body.no-anim .kds-card.leaving { animation: none; }
  body.no-anim .kds-moving { transition: none; }
  /* P1: tab slide animation also gated by the in-app toggle */
  body.no-anim .kds-main.slide-right, body.no-anim .kds-main.slide-left { animation: none; }

  .kds-card-header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 9px;
    padding: 9px 13px; font-size: 13px; font-weight: 600;
    transition: background 0.2s;
    /* the whole header is a toggle button (minimize/restore the card) */
    width: 100%; border: none; text-align: left; cursor: pointer;
    font-family: inherit; font-weight: inherit; -webkit-tap-highlight-color: transparent;
    /* color set inline via contrastText(bg); children only vary opacity
       Layout: 3 flex children — icon | left column | right column.
       Left column stacks (order-no, order-id); right column stacks
       (customer, status) so the visual rows match the old design:
       row1: #12 ... customer, row2: id ... status */
  }
  .kds-card-header:hover { filter: brightness(1.06); }
  .kds-card.collapsed .kds-card-header { border-radius: 8px; } /* rounded bottom when minimized */
  .kds-card-header-icon { display: flex; align-items: center; flex-shrink: 0; }
  .kds-card-header-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .kds-card-header-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kds-card-header-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .kds-card-chevron {
    flex-shrink: 0; width: 14px; height: 14px; opacity: 0.5;
    transition: transform 0.22s ease; display: inline-flex; align-items: center; justify-content: center;
  }
  .kds-card.collapsed .kds-card-chevron { transform: rotate(180deg); }
  .kds-card-chevron svg { width: 12px; height: 12px; }
  .kds-card-header .order-no { font-weight: 700; }
  .kds-card-header .customer { font-weight: 600; }
  .kds-card-header .time { opacity: 0.6; font-size: 11px; font-weight: 400; white-space: nowrap; }
  /* meta row: received HH:MM · live elapsed, then the fixed-height status
     slot — both vertically centered on one line (P2: spec HH:MM restored) */
  .kds-card-header-meta { display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .kds-card-header .status {
    opacity: 0.55; font-size: 11px; font-weight: 400; font-style: italic;
    /* fixed height for ALL states: the blank placeholder, the text-only
       paused, and the pill variants (processing/prepared, which add
       padding) must occupy the same box so the header never changes
       height when the status appears/disappears. border-box makes the
       pill padding fit inside the fixed height. */
    box-sizing: border-box;
    height: 22px; line-height: 18px;
    display: inline-flex; align-items: center;
  }
  .kds-card-header .status.paused { opacity: 0.9; font-style: normal; }
  .kds-card-header .status.processing {
    opacity: 1; font-style: normal;
    animation: kds-blink 2.5s ease-in-out infinite;
    padding: 2px 8px; border-radius: 5px; font-weight: 600;
    display: inline-flex; align-items: center;
  }
  /* prepared: everything is done, awaiting Mark Finish — pill (bg inline) */
  .kds-card-header .status.prepared {
    background: #22c55e; color: #fff; opacity: 1; font-style: normal;
    padding: 2px 8px; border-radius: 5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 3px;
  }
  @keyframes kds-blink { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
  .kds-service-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .kds-rush-badge {
    /* color set inline via contrastText(rush) */
    font-size: 10px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; letter-spacing: 0.5px;
  }

  .kds-card-main { flex: 1 1 auto; min-height: 0; padding: 0; position: relative; }

  /* Collapsible section: animates to any height via grid-template-rows.
     The grid MUST have exactly ONE child — with two children the second
     creates an implicit auto row that never collapses. So main + footer
     are wrapped in a single .kds-card-collapsible-inner.
     Directional curves are set inline by JS per toggle:
       expand  → decelerate (fast start, soft settle — unfolds)
       collapse → accelerate (slow start, fast finish — tucks away) */
  .kds-card-collapsible {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-rows: 1fr;
    /* fallback when JS hasn't set a directional curve */
    transition: grid-template-rows 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s ease;
  }
  .kds-card-collapsible-inner {
    min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    transform-origin: top center;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .kds-card.collapsed .kds-card-collapsible { grid-template-rows: 0fr; opacity: 0; }
  /* fold: content compresses toward the top while the row collapses */
  .kds-card.collapsed .kds-card-collapsible-inner { transform: scaleY(0.85); }

  .kds-category { border-bottom: 1px solid var(--border); padding: 3px 0 2px 0; transition: background 0.15s; }
  .kds-category:last-child { border-bottom: none; padding-bottom: 0; }
  /* Whole-section hover (station-level unit): when the header is hovered,
     the ENTIRE category block lights up (header + its items). Items alone
     do NOT trigger it — they toggle individually. */
  .kds-category:has(.kds-category-header:hover) { background: rgba(255,255,255,0.06); }
  .kds-screen.light .kds-category:has(.kds-category-header:hover) { background: rgba(0,0,0,0.06); }
  .kds-category-header {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 6px 13px; border: none; background: transparent;
    color: var(--text); opacity: 0.85; cursor: pointer; font-size: 12px; font-weight: 600;
    transition: background 0.1s; text-align: left;
    /* fixed row height: identical whether checked or not */
    min-height: 30px; line-height: 1.2;
  }
  .kds-category-header:hover { background: transparent; }
  .kds-category-header:active { background: rgba(255,255,255,0.09); }
  /* light theme: active uses dark; hover is handled by the section */
  .kds-screen.light .kds-category-header:active { background: rgba(0,0,0,0.1); }
  /* left area: the single "n/M CategoryName" label, pushed to the very right */
  .kds-cat-label {
    flex: 1; display: flex; justify-content: flex-end;
    opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* right area: reserved check slot — always occupies width so the
     header never shifts when the check appears/disappears */
  .kds-cat-check {
    flex-shrink: 0; width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
  }
  .kds-cat-check.done { opacity: 1; color: #22c55e; }

  .kds-item { padding: 0 6px; }
  .kds-item-row {
    display: flex; flex-direction: column;  /* allows the note to live inside the button */
    width: 100%; padding: 4px 7px; border: none; background: transparent;
    color: var(--text); opacity: 0.85; cursor: pointer; font-size: 13px; border-radius: 8px;
    transition: background 0.1s; text-align: left;
    /* fixed row height: identical whether checked or not (the done-time
       text appears/disappears without changing the row size) */
    min-height: 28px; line-height: 1.3;
  }
  .kds-item-row-inner {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 20px; gap: 6px;
  }
  .kds-item-row:hover { background: rgba(255,255,255,0.05); }
  .kds-item-row:active { background: rgba(255,255,255,0.09); }
  /* light theme: white hover is invisible on white cards → use dark */
  .kds-screen.light .kds-item-row:hover { background: rgba(0,0,0,0.06); }
  .kds-screen.light .kds-item-row:active { background: rgba(0,0,0,0.1); }
  .kds-item-row.done { opacity: 0.4; }
  .kds-item-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .kds-item-qty { opacity: 0.6; font-size: 12px; }
  .kds-item-row.done .kds-item-qty { opacity: 0.6; }
  .kds-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kds-item-done-time { opacity: 0.45; font-size: 10px; flex-shrink: 0; }
  .kds-item-note {
    opacity: 0.5; font-style: italic; font-size: 11px;
    padding: 0 0 2px 7px; overflow: hidden; text-align: left;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .kds-order-notes {
    opacity: 0.55; font-style: italic; font-size: 11px;
    padding: 6px 13px; border-top: 1px solid var(--border);
  }

  .kds-card-footer { flex: 0 0 auto; padding: 0 10px 7px; display: flex; flex-direction: column; gap: 6px; }
  .kds-footer-actions { display: flex; gap: 6px; }
  .kds-footer-actions .kds-status-btn { flex: 1; }
  .kds-status-btn {
    width: 100%; padding: 7px 0; border-radius: 8px; border: none;
    font-size: 12px; font-weight: 600; line-height: 1; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    /* background + color set inline via colors.* + contrastText; hover shifts opacity */
  }
  .kds-status-btn svg { display: block; }
  .kds-status-btn:hover { opacity: 0.85; }
  .kds-status-btn.finish {
    background: transparent; border: 1px solid var(--border-strong);
    color: var(--text); opacity: 0.55; font-size: 11px;
  }
  .kds-status-btn.finish:hover { opacity: 1; background: var(--border); }

  /* ── Completed tab ──────────────────────────────── */
  .kds-completed-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--bg-surface); border-radius: 12px;
    border: 1px solid var(--border-strong); font-size: 12px; color: var(--text);
  }
  .kds-completed-left { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .kds-completed-time { opacity: 0.5; }
  .kds-reopen-btn {
    padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    background: transparent; color: var(--text); opacity: 0.7; cursor: pointer; font-size: 11px;
    transition: all 0.15s; flex-shrink: 0;
  }
  .kds-reopen-btn:hover { background: rgba(255,255,255,0.08); opacity: 1; }

  /* ── SCREEN FOOTER ──────────────────────────────── */
  .kds-screen-footer {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 3px 14px; color: var(--text); opacity: 0.4; font-size: 11px;
    border-top: 1px solid var(--border); pointer-events: none;
  }
  .kds-screen-footer .sep { opacity: 0.5; }

  /* Reusable switch (used for sound, auto-accept) — rows come from
     .kds-setting-row in the panel, not a dedicated row class */
  .kds-switch {
    position: relative; width: 40px; height: 22px; border-radius: 11px; border: none;
    background: rgba(255,255,255,0.12); cursor: pointer; transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .kds-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform 0.2s;
  }
  .kds-switch.on { background: #3b82f6; }
  .kds-switch.on::after { transform: translateX(18px); }
  /* light theme: darken the switch track so it is visible on white */
  .kds-screen.light .kds-switch { background: rgba(0,0,0,0.08); }
  .kds-screen.light .kds-switch.on { background: #3b82f6; }
  /* light theme: muted helper buttons (zoom steppers, filter idle) need
     dark overlays — the dark-theme white tokens vanish on white cards */
  .kds-screen.light .kds-btn--muted {
    --btn-bg: rgba(0,0,0,0.05);
    --btn-hover: rgba(0,0,0,0.09);
    --btn-active: rgba(0,0,0,0.12);
    --btn-state: rgba(0,0,0,0.1);
    --btn-state-hover: rgba(0,0,0,0.14);
  }
  /* light theme: hover overlays that were dark-only white (P1) */
  .kds-screen.light .kds-btn--icon:hover { background: rgba(0,0,0,0.08); opacity: 1; }
  .kds-screen.light .kds-btn--icon:active { background: rgba(0,0,0,0.12); }
  .kds-screen.light .kds-filter-option:not(.checked):hover { background: rgba(0,0,0,0.07); }
  .kds-screen.light .kds-reopen-btn:hover { background: rgba(0,0,0,0.08); opacity: 1; }

  /* ── Confirm modal (P4: styled replacement for window.confirm) ── */
  .kds-modal-backdrop {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
    animation: kds-drop-in 0.18s ease-out;
  }
  .kds-modal-backdrop[hidden] { display: none; }
  .kds-modal {
    width: min(360px, calc(100vw - 48px));
    background: var(--bg-top); border: 1px solid var(--border-strong);
    border-radius: 16px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .kds-modal-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .kds-modal-msg { font-size: 12px; color: var(--text); opacity: 0.7; line-height: 1.5; margin-bottom: 16px; }
  .kds-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .kds-modal-actions .kds-btn { min-height: 28px; }
  .kds-modal-actions .kds-btn.danger { --btn-bg: #ef4444; --btn-hover: #dc2626; --btn-active: #b91c1c; }

  /* Visually-hidden live region (P4: aria-live) */
  .kds-visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<div class="kds-screen" id="screen">
  <!-- TOPMENU -->
  <div class="kds-topmenu">
    <div class="kds-topmenu-left">
      <button class="kds-btn kds-btn--icon" id="back-btn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="kds-filter">
        <button class="kds-btn kds-btn--filter all" id="filter-btn" aria-haspopup="listbox" aria-expanded="false"><span>All Categories</span><span class="caret"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 9h12l-6 7z"/></svg></span></button>
        <div class="kds-filter-panel" id="filter-panel" role="listbox" aria-multiselectable="true" style="display:none"></div>
      </div>
    </div>
    <div class="kds-tabs" id="tabs">
      <span class="kds-tab-indicator" id="tab-indicator"></span>
      <button class="kds-tab active" data-tab="open"><span>Open</span><span class="kds-tab-count" id="count-open">0</span></button>
      <button class="kds-tab" data-tab="completed"><span>Completed</span><span class="kds-tab-count" id="count-completed">0</span></button>
    </div>
    <div class="kds-topmenu-right">
      <button class="kds-btn kds-btn--shift kds-btn--stack" id="shift-btn"><span class="visible">Start Shift</span><span>End Shift</span></button>
      <button class="kds-btn kds-btn--icon" id="hamburger-btn" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="kds-hamburger-panel" id="hamburger-panel" role="dialog" aria-label="Settings" aria-hidden="true" style="display:none;">
        <button class="kds-panel-close" id="panel-close" title="Close" aria-label="Close settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="kds-panel-body">
          <!-- DISPLAY: theme + scale -->
          <div class="kds-panel-section">
            <h3>Display</h3>
            <div class="kds-setting-card">
              <div class="kds-setting-row">
                <span class="kds-setting-label">Theme</span>
                <button class="kds-theme-toggle" id="theme-toggle" title="Toggle light/dark" aria-label="Toggle light or dark theme">
                  <span class="kds-theme-indicator" id="theme-indicator"></span>
                  <span class="kds-theme-option on" data-theme="dark" aria-label="Dark theme">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
                  </span>
                  <span class="kds-theme-option" data-theme="light" aria-label="Light theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                  </span>
                </button>
              </div>
              <div class="kds-setting-row">
                <span class="kds-setting-label">Display scale</span>
                <div class="kds-zoom-row">
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="pagezoom-out" aria-label="Zoom out">−</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-value" id="pagezoom-value" title="Reset to 100%" aria-label="Reset page zoom to 100%">100%</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="pagezoom-in" aria-label="Zoom in">+</button>
                </div>
              </div>
              <div class="kds-setting-row">
                <span class="kds-setting-label">Card size</span>
                <div class="kds-zoom-row">
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="zoom-out" aria-label="Zoom out">−</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-value" id="zoom-value" title="Reset to 100%" aria-label="Reset card size to 100%">100%</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
                </div>
              </div>
            </div>
          </div>
          <!-- BEHAVIOUR: kitchen toggles -->
          <div class="kds-panel-section">
            <h3>Behaviour</h3>
            <div class="kds-setting-card">
              <div class="kds-setting-row">
                <div class="kds-setting-text">
                  <span class="kds-setting-label">New order sound</span>
                  <span class="kds-setting-caption">Chime when an order arrives</span>
                </div>
                <button class="kds-switch on" id="toggle-sound" role="switch" aria-checked="true" aria-label="New order sound"></button>
              </div>
              <div class="kds-setting-row">
                <div class="kds-setting-text">
                  <span class="kds-setting-label">Auto-accept</span>
                  <span class="kds-setting-caption">New orders appear without tapping Accept</span>
                </div>
                <button class="kds-switch" id="toggle-ack" role="switch" aria-checked="false" aria-label="Auto-accept new orders"></button>
              </div>
              <div class="kds-setting-row">
                <div class="kds-setting-text">
                  <span class="kds-setting-label">Card animations</span>
                  <span class="kds-setting-caption">Spawn and reorder effects</span>
                </div>
                <button class="kds-switch on" id="toggle-anim" role="switch" aria-checked="true" aria-label="Card spawn and move animations"></button>
              </div>
            </div>
          </div>
          <!-- CARD COLOURS: per-theme config, accordion groups + scoped reset -->
          <div class="kds-panel-section">
            <div class="kds-section-head">
              <h3>Card Colours</h3>
              <span class="kds-theme-tag" id="theme-tag">dark</span>
            </div>
            <div class="kds-setting-card">
              <div id="color-panel"></div>
              <button class="kds-reset-btn" id="reset-colors">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                Reset colours
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="kds-main" id="main"></div>

  <!-- SCREEN FOOTER -->
  <div class="kds-screen-footer">
    <span>192.168.1.42</span><span class="sep">|</span>
    <span id="clock">14 Aug 14:55</span><span class="sep">|</span>
    <span>Last synced: 2s ago</span><span class="sep">|</span>
    <span>Connected</span>
  </div>

  <!-- Confirm modal — styled replacement for window.confirm (P4) -->
  <div class="kds-modal-backdrop" id="confirm-backdrop" hidden>
    <div class="kds-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
      <h2 class="kds-modal-title" id="confirm-title"></h2>
      <p class="kds-modal-msg" id="confirm-msg"></p>
      <div class="kds-modal-actions">
        <button class="kds-btn kds-btn--muted" id="confirm-cancel" type="button">Cancel</button>
        <button class="kds-btn" id="confirm-ok" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Visually-hidden live region: announces order state to screen readers -->
  <div class="kds-visually-hidden" id="screen-announcer" aria-live="polite"></div>
</div>

<script>
  /* Colour system: 8 configurable colours in 3 semantic groups.
     Every coloured element on a card is driven by these — kitchens
     colour-code differently, so all of them are user-controllable.
     The swatch palette is shared: a kitchen assigns MEANING to a
     colour, so the preset set is identical for every slot. */
  const PALETTE = ['#22c55e', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
  const COLOR_GROUPS = [
    { title: 'Service Types', keys: [
      { key: 'dinein', label: 'Dine-in' },
      { key: 'takeaway', label: 'Takeaway' },
    ]},
    { title: 'Badges', keys: [
      { key: 'rush', label: 'Rush badge' },
      { key: 'processing', label: 'Processing badge' },
      { key: 'prepared', label: 'Prepared badge' },
    ]},
    { title: 'Action Buttons', keys: [
      { key: 'pause', label: 'Pause button' },
      { key: 'resume', label: 'Resume button' },
      { key: 'complete', label: 'Complete button' },
    ]},
  ];
  const DEFAULT_COLORS = {
    dinein: '#22c55e', takeaway: '#3b82f6',
    rush: '#ef4444', processing: '#f59e0b', prepared: '#22c55e',
    pause: '#f59e0b', resume: '#3b82f6', complete: '#4ade80',
  };
  /* Theme choice is persisted so colour experiments survive a reload —
     with per-theme colour configs, the theme you're tuning has to stick. */
  const THEME_KEY = 'kds-proto-theme';
  let theme = 'dark';
  try { if (localStorage.getItem(THEME_KEY) === 'light') theme = 'light'; } catch {}
  if (theme === 'light') {
    document.getElementById('screen').classList.add('light');
    document.querySelectorAll('.kds-theme-option').forEach(o =>
      o.classList.toggle('on', o.dataset.theme === 'light'));
  }

  /* Per-theme colour configs — one set for dark, one for light, so the
     kitchen tunes colours against each theme independently. The ACTIVE
     config is the current theme's. Prototype-only persistence (per-user
     storage comes with the real backend). */
  const COLORS_KEY = 'kds-proto-colors-v2'; // legacy flat config — migrated once
  const THEME_COLORS_KEY = 'kds-proto-colors-v3';
  function loadColorConfigs() {
    let cfg = { dark: { ...DEFAULT_COLORS }, light: { ...DEFAULT_COLORS } };
    try {
      const raw = localStorage.getItem(THEME_COLORS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.dark) cfg.dark = { ...cfg.dark, ...parsed.dark };
        if (parsed.light) cfg.light = { ...cfg.light, ...parsed.light };
        return cfg;
      }
      /* migrate the legacy flat config into BOTH themes once */
      const legacy = localStorage.getItem(COLORS_KEY);
      if (legacy) {
        const old = JSON.parse(legacy);
        cfg = { dark: { ...DEFAULT_COLORS, ...old }, light: { ...DEFAULT_COLORS, ...old } };
      }
    } catch {}
    return cfg;
  }
  function saveColorConfigs() { try { localStorage.setItem(THEME_COLORS_KEY, JSON.stringify(colorConfigs)); } catch {} }
  function currentTheme() { return document.getElementById('screen').classList.contains('light') ? 'light' : 'dark'; }
  let colorConfigs = loadColorConfigs();
  let colors = colorConfigs[currentTheme()];
  let tab = 'open';
  let orders = initialOrders();
  /* Category filter: null = All, otherwise a Set of course names to show */
  let filterCats = null;
  /* Waiter view: 'processed' shows only orders whose items are ALL done
     (the kitchen finished; a waiter team closes them out). Mutually
     exclusive with category filtering — picking a category clears it. */
  let filterMode = 'all';
  /* Display size: 75%–150%, persisted like colors */
  const ZOOM_KEY = 'kds-proto-zoom';
  let zoom = loadZoom();
  function loadZoom() {
    try { const v = parseInt(localStorage.getItem(ZOOM_KEY), 10); if (!isNaN(v)) return v; } catch {}
    return 100;
  }
  function saveZoom() { try { localStorage.setItem(ZOOM_KEY, String(zoom)); } catch {} }

  /* ── Mock data: 12 active orders ───────────────────
     Deterministic generator: mixes statuses (new/processing/paused),
     dine-in vs takeaway, priorities, category combinations, notes.
     doneAt is a timestamp so elapsed durations compute live. */
  function initialOrders() {
    const now = Date.now();
    const minAgo = (m) => now - m * 60000;
    let seed = 12345; // fixed seed → same board every load
    const rand = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const pick = (arr) => arr[Math.floor(rand() * arr.length)];
    const seq = (n) => '20260202-' + (12520 + n);

    const customers = ['John Smith', 'Jane Doe', 'Alice Wang', 'Bob Lee', 'Maria Garcia', 'Tom Harris', 'Emma Wilson', 'Liam Brown', 'Sofia Rossi', 'Noah Kim', 'Olivia Chen', 'Lucas Meier'];
    const tables = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'];
    const mains = ['Steak A', 'Grilled Chicken', 'Beef Noodles', 'Spaghetti', 'Salmon', 'Pork Chop', 'Ribeye', 'Lamb Curry'];
    const apps = ['Calamari', 'Bruschetta', 'Garlic Bread', 'Spring Rolls', 'Dumplings', 'Caesar Salad', 'Soup'];
    const juices = ['Orange Juice', 'Apple Juice', 'Lemonade', 'Watermelon Juice'];
    const hot = ['Coffee', 'Tea', 'Hot Chocolate', 'Espresso'];
    const cold = ['Iced Tea', 'Soda', 'Milkshake', 'Iced Latte'];
    const notes = ['', '', '', '', 'no garlic', 'extra spicy', 'medium rare', 'no onions', 'gluten free', 'well done'];

    const catSpecs = [
      { course: '🥗 Appetizers', pool: apps },
      { course: '🥩 Mains', pool: mains },
      { course: '🧃 Juice', pool: juices },
      { course: '☕ Hot Drinks', pool: hot },
      { course: '🧊 Cold Drinks', pool: cold },
    ];

    const orders = [];
    for (let n = 0; n < 12; n++) {
      const id = seq(n);
      const minAge = 3 + Math.floor(rand() * 22);      // received 3–25 min ago
      const received = minAgo(minAge);
      const dineIn = rand() < 0.7;                      // 70% dine-in
      const nCats = 1 + Math.floor(rand() * 3);         // 1–3 categories
      const pickedCats = [];
      const pool = [...catSpecs];
      for (let c = 0; c < nCats && pool.length; c++) {
        pickedCats.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
      }
      // Status: new orders have nothing done (they transition on first tap);
      // processing has a mix; paused is mostly done
      const status = n % 6 === 5 ? 'paused' : n % 3 === 0 ? 'new' : 'processing';

      const categories = pickedCats.map((cs, ci) => {
        const nItems = 1 + Math.floor(rand() * 3);      // 1–3 items per category
        const used = new Set();
        const items = [];
        for (let i = 0; i < nItems; i++) {
          let name = pick(cs.pool);
          let guard = 0;
          while (used.has(name) && guard++ < 10) name = pick(cs.pool);
          used.add(name);
          const qty = 1 + Math.floor(rand() * 4);
          // Done probability depends on status: processing more items done,
          // paused many done, new none (so it can transition on first tap)
          let done;
          if (status === 'new') done = false;
          else done = rand() < (status === 'paused' ? 0.9 : 0.55);
          items.push({
            id: id + '-i' + ci + '-' + i,
            name, qty,
            done,
            doneAt: done ? minAgo(minAge - Math.floor(rand() * Math.max(1, minAge - 1))) : null,
            note: pick(notes),
          });
        }
        return { course: cs.course, items };
      });

      orders.push({
        id, display: String(8 + n), table: dineIn ? pick(tables) : null,
        customer: pick(customers), received,
        priority: rand() < 0.15, dineIn, status, notes: pick(notes),
        categories,
      });
    }
    return orders;
  }

  function fmtDuration(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    if (m === 0) return r + 's';
    if (r === 0) return m + 'm';
    return m + 'm ' + r + 's';
  }

  /* Smart text colour: white on dark backgrounds, black on light ones.
     Only opacity is defined per element — the hue is always ~90% white
     (#e6e6e6) or ~90% black (#1a1a1a), never full 255/0. */
  function contrastText(hex) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substr(0, 2), 16) / 255;
    const g = parseInt(h.substr(2, 2), 16) / 255;
    const b = parseInt(h.substr(4, 2), 16) / 255;
    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
    return lum > 0.55 ? '#1a1a1a' : '#e6e6e6';
  }


  /* Dine-in icon: spoon + fork (minimal line, Lucide "utensils" style) */
  const DINE_ICON = '<svg class="kds-service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>';
  /* Takeaway icon: shopping/takeaway bag (minimal line) */
  const TAKEAWAY_ICON = '<svg class="kds-service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
  /* Pause icon: two solid rounded bars (chunkier, centered) */
  const PAUSE_ICON = '<svg class="kds-service-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="5" height="16" rx="1.5"/><rect x="13" y="4" width="5" height="16" rx="1.5"/></svg>';
  /* Resume / play icon: right-pointing triangle (centered: x 5-19, center 12) */
  const RESUME_ICON = '<svg class="kds-service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 19 12 5 20 5 4"/></svg>';
  /* Finish / check icon */
  const FINISH_ICON = '<svg class="kds-service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  /* Sun icon (light theme) */
  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  /* Moon icon (dark theme) */
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  /* Filter caret: solid down-triangle (matches ▾) — shared by the static
     button and refreshFilterBtn so the icon can never regress to a glyph */
  const CARET_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 9h12l-6 7z"/></svg>';

  /* Anti-mis-tap cooldown — keyed PER TARGET (the call arguments), so a
     fast kitchen tapping two different items or categories inside the
     window is never blocked; only re-tapping the SAME target is
     throttled (a laggy touchscreen double-fire guard). */
  function cooldown(fn, ms) {
    const last = new Map();
    return function () {
      const key = Array.prototype.map.call(arguments, String).join('\u0001');
      const now = Date.now();
      if (now - (last.get(key) || 0) < ms) return;
      last.set(key, now);
      return fn.apply(this, arguments);
    };
  }

  const toggleItemC = cooldown(toggleItem, 80);
  const toggleCatC = cooldown(toggleCat, 80);
  const advanceC = cooldown(advance, 80);

  function toggleItem(orderId, ci, ii) {
    orders = orders.map(o => {
      if (o.id !== orderId) return o;
      const cats = o.categories.map((cat, x) => x !== ci ? cat : { ...cat, items: cat.items.map((it, y) => y !== ii ? it : { ...it, done: !it.done, doneAt: !it.done ? Date.now() : null }) });
      const started = cats.some(c => c.items.some(i => i.done));
      /* First check → processing; last uncheck → back to new (blank) */
      let status = o.status;
      if (started && status === 'new') status = 'processing';
      else if (!started && status === 'processing') status = 'new';
      return { ...o, categories: cats, status };
    });
    render();
  }
  function toggleCat(orderId, ci) {
    orders = orders.map(o => {
      if (o.id !== orderId) return o;
      const cats = o.categories.map((cat, x) => {
        if (x !== ci) return cat;
        const all = cat.items.every(i => i.done);
        return { ...cat, items: cat.items.map(it => ({ ...it, done: !all, doneAt: !all ? Date.now() : null })) };
      });
      const started = cats.some(c => c.items.some(i => i.done));
      let status = o.status;
      if (started && status === 'new') status = 'processing';
      else if (!started && status === 'processing') status = 'new';
      return { ...o, categories: cats, status };
    });
    render();
  }
  function advance(orderId) {
    orders = orders.map(o => o.id !== orderId ? o : {
      ...o, status: o.status === 'new' ? 'processing' : o.status === 'processing' ? 'paused' : o.status === 'paused' ? 'processing' : o.status,
    });
    render();
  }
  const collapsedOrders = new Set();
  function toggleCardCollapsed(id, btn) {
    const card = btn.closest('.kds-card');
    const expanding = card.classList.contains('collapsed'); // currently collapsed → will expand
    /* directional SOTA curves:
       expanding → decelerate (fast start, soft settle, unfolds)
       collapsing → accelerate (slow start, fast finish, tucks away) */
    const coll = card.querySelector('.kds-card-collapsible');
    if (coll) {
      coll.style.transition = expanding
        ? 'grid-template-rows 0.34s cubic-bezier(0.05, 0.7, 0.1, 1), opacity 0.24s ease'
        : 'grid-template-rows 0.2s cubic-bezier(0.4, 0, 0.8, 0.15), opacity 0.18s ease';
    }
    if (collapsedOrders.has(id)) collapsedOrders.delete(id); else collapsedOrders.add(id);
    card.classList.toggle('collapsed');
    btn.setAttribute('aria-expanded', collapsedOrders.has(id) ? 'false' : 'true');
    /* reset the inline transition after the animation so re-renders
       use the CSS fallback again */
    if (coll) setTimeout(() => { coll.style.transition = ''; }, 500);
  }
  /* P4: screen-reader announcements for meaningful order transitions */
  function announce(msg) {
    const el = document.getElementById('screen-announcer');
    if (el && msg) el.textContent = msg;
  }
  function complete(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) announce('Order #' + (order.table || order.display) + ' completed.');
    const card = document.querySelector(`.kds-card[data-id="${orderId}"]`);
    if (card && kitchen.anim !== false) {
      /* animate the card out IN PLACE first. Two guards:
         1) leaveLock: any render() during the animation is deferred
         2) data is NOT marked completed until after the animation.
        The animationend listener is filtered to the card itself
        (bubbled events from child animations ignored). The timeout
        at 400ms is the primary trigger — animationend just accelerates
        it slightly. */
      leaveLock = true;
      card.classList.add('leaving');
      const finish = () => {
        if (!leaveLock) return; // already ran
        leaveLock = false;
        orders = orders.map(o => o.id === orderId ? { ...o, status: 'completed' } : o);
        render();
      };
      card.addEventListener('animationend', (e) => {
        if (e.target === card) finish();
      });
      setTimeout(finish, 400); // leave animation is 0.25s
    } else {
      orders = orders.map(o => o.id === orderId ? { ...o, status: 'completed' } : o);
      render();
    }
  }
  function reopen(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) announce('Order #' + (order.table || order.display) + ' reopened.');
    orders = orders.map(o => o.id === orderId ? { ...o, status: 'paused' } : o);
    render();
  }

  /* ── render ─────────────────────────────────────── */
  function allCategories() {
    const names = [];
    orders.forEach(o => o.categories.forEach(c => { if (!names.includes(c.course)) names.push(c.course); }));
    return names;
  }
  function visibleCats(o) {
    const all = o.categories.map((c, i) => ({ ...c, _i: i }));
    if (!filterCats) return all;
    return all.filter(c => filterCats.has(c.course));
  }
  /* ── Category filter (dropdown) ────────────────────
     Top row: two view modes — 'All' (everything) and 'Processed'
     (kitchen done, waiter team closes out). Below: category options
     (plain text, emoji stripped, no counts). Selected = blue pill
     (matches the tab indicator). Modes and categories are mutually
     exclusive: picking a category clears 'Processed' and vice versa. */
  /* Strip emoji from a course name for display (e.g. '🥗 Appetizers' → 'Appetizers') */
  function plainName(name) {
    return name.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu, '').trim();
  }
  function buildFilterPanel() {
    const panel = document.getElementById('filter-panel');
    const cats = allCategories();
    const allActive = filterMode !== 'processed' && (!filterCats || filterCats.size === 0);
    const procActive = filterMode === 'processed';
    const rows = cats.map(c => `
      <div class="kds-filter-option${filterCats && filterCats.has(c) ? ' checked' : ''}" data-cat="${c}" role="option" tabindex="-1" aria-selected="${filterCats && filterCats.has(c)}">
        <span>${plainName(c)}</span>
      </div>`).join('');
    panel.innerHTML = `
      <div class="kds-filter-modes">
        <div class="kds-filter-option mode${allActive ? ' checked' : ''}" data-mode="all" role="option" tabindex="-1" aria-selected="${allActive}">
          <span>All</span>
        </div>
        <div class="kds-filter-option mode${procActive ? ' checked' : ''}" data-mode="processed" role="option" tabindex="-1" aria-selected="${procActive}">
          <span>Processed</span>
        </div>
      </div>
      <div class="kds-filter-grid">${rows}</div>`;
  }
  function refreshFilterBtn() {
    const btn = document.getElementById('filter-btn');
    /* Button is blue whenever a filter is in effect — default 'All
       Categories', 'Processed', or any selected-category combination.
       Children are built via DOM: the label MUST be an element (not a
       raw text node) for the hover pop animation, and textContent keeps
       category names safe from HTML injection. */
    btn.classList.add('all');
    let label;
    if (filterMode === 'processed') label = 'Processed';
    else if (!filterCats || filterCats.size === 0) label = 'All Categories';
    else if (filterCats.size === 1) label = plainName(filterCats.values().next().value);
    else label = filterCats.size + ' selected';
    btn.textContent = '';
    const labelEl = document.createElement('span');
    labelEl.textContent = label;
    const caretEl = document.createElement('span');
    caretEl.className = 'caret';
    caretEl.innerHTML = CARET_SVG;
    btn.append(labelEl, caretEl);
  }
  function toggleFilterPanel(force) {
    const panel = document.getElementById('filter-panel');
    const btn = document.getElementById('filter-btn');
    const showing = force !== undefined ? force : panel.style.display !== 'block';
    if (showing) buildFilterPanel();
    panel.style.display = showing ? 'block' : 'none';
    btn.classList.toggle('open', showing);
    btn.setAttribute('aria-expanded', showing);
  }
  document.getElementById('filter-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFilterPanel();
  });
  document.getElementById('filter-panel').addEventListener('click', (e) => {
    e.stopPropagation();
    const opt = e.target.closest('.kds-filter-option');
    if (!opt) return;
    if (opt.dataset.mode) {
      /* view modes: All (everything) vs Processed (kitchen done) —
         both clear any category selection */
      if (opt.dataset.mode === 'processed') { filterMode = 'processed'; filterCats = null; }
      else { filterMode = 'all'; filterCats = null; }
    } else {
      /* category toggle — switching to category mode clears 'Processed' */
      const cat = opt.dataset.cat;
      filterMode = 'all';
      /* Start from an empty set (not all categories) so clicking a
         category selects ONLY it — otherwise the toggle would delete it. */
      if (!filterCats) filterCats = new Set();
      if (filterCats.has(cat)) filterCats.delete(cat); else filterCats.add(cat);
      if (filterCats.size === 0) filterCats = null;
    }
    buildFilterPanel();
    refreshFilterBtn();
    render();
  });
  document.addEventListener('click', () => toggleFilterPanel(false));

  /* P4: keyboard navigation for the category listbox —
     ArrowDown/Up move roving focus among options, Enter/Space select,
     Home/End jump, Escape closes and returns to the trigger. */
  function filterOptions() { return Array.from(document.querySelectorAll('#filter-panel .kds-filter-option')); }
  function filterMoveFocus(dir) {
    const opts = filterOptions();
    if (!opts.length) return;
    let idx = opts.indexOf(document.activeElement);
    /* no option focused yet: ArrowDown starts at the FIRST option,
       ArrowUp at the LAST (standard listbox behaviour) */
    if (idx === -1) idx = dir > 0 ? -1 : 0;
    idx = (idx + dir + opts.length) % opts.length;
    opts[idx].focus();
  }
  document.getElementById('filter-btn').addEventListener('keydown', (e) => {
    const open = document.getElementById('filter-panel').style.display === 'block';
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!open) toggleFilterPanel(true);
      filterMoveFocus(e.key === 'ArrowDown' ? 1 : -1);
      e.preventDefault();
    } else if (e.key === 'Enter' || e.key === ' ') {
      if (!open) { e.preventDefault(); toggleFilterPanel(); }
    }
  });
  document.getElementById('filter-panel').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { filterMoveFocus(e.key === 'ArrowDown' ? 1 : -1); e.preventDefault(); }
    else if (e.key === 'Home') { const o = filterOptions(); if (o.length) { o[0].focus(); e.preventDefault(); } }
    else if (e.key === 'End') { const o = filterOptions(); if (o.length) { o[o.length - 1].focus(); e.preventDefault(); } }
    else if (e.key === 'Enter' || e.key === ' ') {
      const a = document.activeElement;
      if (a && a.classList && a.classList.contains('kds-filter-option')) { e.preventDefault(); a.click(); }
    }
    else if (e.key === 'Escape') { toggleFilterPanel(false); document.getElementById('filter-btn').focus(); }
  });

  function cardHTML(o) {
    const vis = visibleCats(o);
    const allDone = vis.every(c => c.items.every(i => i.done));
    const doneCount = vis.reduce((s, c) => s + c.items.filter(i => i.done).length, 0);
    const remaining = vis.reduce((s, c) => s + c.items.filter(i => !i.done).length, 0);
    const hdrBg = o.dineIn ? colors.dinein : colors.takeaway;
    const hdrText = contrastText(hdrBg);
    const rushBg = colors.rush;
    const rushText = contrastText(rushBg);

    let statusBtn = '';
    let btnBg = '', btnText = '';
    if (allDone) {
      btnBg = colors.complete; btnText = contrastText(btnBg);
      statusBtn = `<button class="kds-status-btn complete" style="background:${btnBg};color:${btnText}" onclick="complete('${o.id}')">${FINISH_ICON.replace('<svg', '<svg style="width:14px;height:14px"')}Mark Finish</button>`;
    } else {
      /* In-progress orders show the status action (Pause/Resume) plus a
         Force Finish button — for restaurants WITHOUT a dedicated waiter:
         the kitchen can push the order out even with unchecked items.
         Force Finish always confirms with the count.
         Distinct from 'Mark Finish' above, which only appears when every
         item is done (the order is prepared). */
      if (o.status === 'paused') {
        btnBg = colors.resume; btnText = contrastText(btnBg);
        statusBtn = `<button class="kds-status-btn resume" style="background:${btnBg};color:${btnText}" onclick="advanceC('${o.id}')">${RESUME_ICON.replace('<svg', '<svg style="width:14px;height:14px"')}Resume</button>`;
      } else if (o.status === 'processing') {
        btnBg = colors.pause; btnText = contrastText(btnBg);
        statusBtn = `<button class="kds-status-btn pause" style="background:${btnBg};color:${btnText}" onclick="advanceC('${o.id}')">${PAUSE_ICON.replace('<svg', '<svg style="width:14px;height:14px"')}Pause</button>`;
      }
      /* Force Finish is always paired with the status action while in progress */
      statusBtn += `<button class="kds-status-btn finish" onclick="overrideComplete('${o.id}', ${remaining})">${FINISH_ICON.replace('<svg', '<svg style="width:14px;height:14px"')}Force Finish</button>`;
    }
    const footerActions = statusBtn ? `<div class="kds-footer-actions">${statusBtn}</div>` : '';

    return `
    <div class="kds-card${collapsedOrders.has(o.id) ? ' collapsed' : ''}" data-id="${o.id}" data-received="${o.received}">
      <button class="kds-card-header" style="background:${hdrBg};color:${hdrText}" onclick="toggleCardCollapsed('${o.id}', this)" aria-expanded="${collapsedOrders.has(o.id) ? 'false' : 'true'}">
        <div class="kds-card-header-icon">${o.dineIn ? DINE_ICON : TAKEAWAY_ICON}</div>
        <div class="kds-card-header-left">
          <div class="kds-card-header-row">
            <span class="order-no">#${o.table || o.display}</span>
            ${o.priority ? `<span class="kds-rush-badge" style="background:${rushBg};color:${rushText}">RUSH</span>` : ''}
          </div>
        </div>
        <div class="kds-card-header-right">
          <span class="customer">${o.customer}</span>
          <div class="kds-card-header-meta">
            <span class="time">${new Date(o.received).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} · ${fmtDuration(Date.now() - o.received)}</span>
            ${allDone
              ? `<span class="status prepared" style="background:${colors.prepared};color:${contrastText(colors.prepared)}">✓ prepared</span>`
              : o.status === 'paused'
                ? `<span class="status paused">⏸ paused</span>`
                : o.status === 'processing'
                  ? `<span class="status processing" style="background:${colors.processing};color:${contrastText(colors.processing)}">processing</span>`
                  : `<span class="status" aria-hidden="true">&nbsp;</span>`}
          </div>
        </div>
        <span class="kds-card-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="kds-card-collapsible">
        <div class="kds-card-collapsible-inner">
        <div class="kds-card-main">
          ${visibleCats(o).map((cat, ci) => {
            const origIdx = cat._i !== undefined ? cat._i : ci;
            return `
            <div class="kds-category">
              <button class="kds-category-header" onclick="toggleCatC('${o.id}', ${origIdx})">
                <span class="kds-cat-label">${cat.items.filter(i => i.done).length}/${cat.items.length} ${plainName(cat.course)}</span>
                <span class="kds-cat-check${cat.items.every(i => i.done) ? ' done' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:10px;height:10px"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
              </button>
              ${cat.items.map((it, ii) => `
                <div class="kds-item">
                  <button class="kds-item-row${it.done ? ' done' : ''}" onclick="toggleItemC('${o.id}', ${origIdx}, ${ii})">
                    <span class="kds-item-row-inner">
                      <span class="kds-item-left">
                        <span class="kds-item-qty">${it.qty}×</span>
                        <span class="kds-item-name">${it.name}</span>
                      </span>
                      ${it.done && it.doneAt ? `<span class="kds-item-done-time">${fmtDuration(it.doneAt - o.received)}</span>` : ''}
                    </span>
                    ${it.note ? `<span class="kds-item-note">${it.note}</span>` : ''}
                  </button>
                </div>
              `).join('')}
            </div>
          `}).join('')}
        </div>
        <div class="kds-card-footer">
          ${o.notes ? `<div class="kds-order-notes">Notes: "${o.notes}"</div>` : ''}
          ${footerActions}
        </div>
        </div>
      </div>
    </div>`;
  }

  function completedRowHTML(o) {
    return `
    <div class="kds-completed-card">
      <div class="kds-completed-left">
        <span style="font-weight:600">#${o.display}</span>
        ${o.table ? `<span style="opacity:0.5">· ${o.table}</span>` : ''}
        <span>· ${o.customer}</span>
        <span class="kds-completed-time">${new Date(o.received).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} · in ${fmtDuration(Date.now() - o.received)}</span>
      </div>
      <button class="kds-reopen-btn" onclick="reopen('${o.id}')">Reopen</button>
    </div>`;
  }

  let leaveLock = false;
  let prevTab = 'open';

  function render() {
    if (leaveLock) return; // a card is mid-leave; defer until animationend
    const main = document.getElementById('main');
    const savedScroll = main.scrollTop; // preserve scroll position across rebuild
    const animOn = kitchen.anim !== false && tab === prevTab;

    /* Static positioning — cards stay where they are once placed:
       RUSH/priority first, then oldest received first (FIFO).
       Paused orders do NOT move to the bottom: the ⏸ icon + amber
       colour already mark them, and keeping them in place avoids
       confusing card jumps on pause/resume. */
    const open = orders
      .filter(o =>
        o.status !== 'completed'
        /* waiter view: only orders where the kitchen finished everything */
        && (filterMode !== 'processed' || o.categories.every(c => c.items.every(i => i.done)))
        && (!filterCats || visibleCats(o).length > 0))
      .sort((a, b) => {
        if (a.priority !== b.priority) return a.priority ? -1 : 1;
        return a.received - b.received; // oldest first
      });
    const done = orders.filter(o => o.status === 'completed');
    document.getElementById('count-open').textContent = open.length;
    document.getElementById('count-completed').textContent = done.length;

    if (tab === 'open') {
      main.className = 'kds-main' + (open.length === 0 ? ' empty' : '') + (prevTab !== 'open' ? ' slide-right' : '');

      /* ── FLIP: FIRST — record old card positions ── */
      let oldPos = null;
      if (animOn) {
        oldPos = new Map();
        main.querySelectorAll('.kds-card[data-id]').forEach(card => {
          const r = card.getBoundingClientRect();
          oldPos.set(card.dataset.id, {
            left: r.left, top: r.top, width: r.width, height: r.height, el: card,
          });
        });
      }

      main.innerHTML = '';
      if (open.length === 0) {
        main.innerHTML = '<div class="kds-empty">' +
          (filterMode === 'processed'
            ? 'No processed orders — kitchen still cooking'
            : filterCats && filterCats.size > 0
              ? 'No open orders in the selected categories'
              : 'No active orders — kitchen is clear') +
          '</div>';
      } else {
        /* JS masonry: equal columns, each card to the shortest column so
           heights pack with no gaps. Min card width 380px — tuned so the
           minimum supported screen (1280x720) gets exactly 3 columns;
           4 columns only appear at 1600px+. Formula accounts for the
           12px inter-column gaps and the 14px main padding. */
        const gap = 12, pad = 14;
        const avail = (main.clientWidth || 1200) - pad * 2;
        const nCols = Math.max(1, Math.min(4, Math.floor((avail + gap) / (380 + gap))));
        const cols = [];
        for (let c = 0; c < nCols; c++) {
          const el = document.createElement('div');
          el.className = 'kds-col';
          main.appendChild(el);
          cols.push(el);
        }
        open.forEach(o => {
          const wrap = document.createElement('div');
          wrap.innerHTML = cardHTML(o);
          const card = wrap.firstElementChild;
          if (!card) return;
          let shortest = cols[0];
          cols.forEach(col => { if (col.offsetHeight < shortest.offsetHeight) shortest = col; });
          shortest.appendChild(card);
        });
      }
      /* restore the scroll position BEFORE any FLIP measurement —
         innerHTML = '' resets scrollTop to 0, which would both yank the
         kitchen back to the top and, worse, make the FLIP rects be read
         in a different coordinate space than the old positions (the
         classic scrolled-FLIP glitch: cards jump while animating). */
      main.scrollTop = savedScroll;

      /* ── FLIP: LAST + INVERT + PLAY ──
         Gone cards are handled by complete() (they animate out in place
         BEFORE the re-render), so here we only FLIP survivors + spawn. */
      if (animOn && oldPos && oldPos.size > 0) {
        const newCards = main.querySelectorAll('.kds-card[data-id]');

        /* FLIP: animate existing cards from old → new position */
        newCards.forEach(card => {
          const id = card.dataset.id;
          const o = oldPos.get(id);
          if (!o) {
            card.classList.add('kds-card-spawn');
            return;
          }
          const r = card.getBoundingClientRect();
          const dx = o.left - r.left;
          const dy = o.top - r.top;
