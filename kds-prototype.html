          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return; // no move
          card.classList.add('kds-moving');
          card.style.transform = `translate(${dx}px, ${dy}px)`;
          void card.offsetWidth; // force reflow → the inverted position is rendered
          card.style.transform = '';
          const end = () => { card.classList.remove('kds-moving'); card.removeEventListener('transitionend', end); };
          card.addEventListener('transitionend', end);
        });
      }
    } else {
      main.className = 'kds-main completed-view' + (prevTab !== 'completed' ? ' slide-left' : '');
      main.innerHTML = done.length === 0
        ? '<div class="kds-empty">No completed orders yet</div>'
        : done.map(completedRowHTML).join('');
      main.scrollTop = savedScroll; // completed rows: keep the position too
    }
    prevTab = tab;
  }

  function overrideComplete(orderId, remaining) {
    confirmModal(
      'Force Finish this order? ' + remaining + ' item(s) still unchecked.',
      'Force Finish',
      () => complete(orderId),
      true
    );
  }

  /* ── confirm modal (P4: styled replacement for window.confirm) ── */
  let _confirmOk = null;
  function confirmModal(message, okLabel, onOk, danger) {
    const backdrop = document.getElementById('confirm-backdrop');
    document.getElementById('confirm-msg').textContent = message;
    const ok = document.getElementById('confirm-ok');
    ok.textContent = okLabel || 'Confirm';
    ok.classList.toggle('danger', !!danger);
    _confirmOk = onOk;
    backdrop.hidden = false;
    ok.focus();
  }
  function closeConfirm() {
    const backdrop = document.getElementById('confirm-backdrop');
    if (backdrop.hidden) return;
    backdrop.hidden = true;
    _confirmOk = null;
  }
  document.getElementById('confirm-ok').addEventListener('click', () => {
    const fn = _confirmOk;
    closeConfirm();
    if (fn) fn();
  });
  document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
  document.getElementById('confirm-backdrop').addEventListener('click', (e) => {
    if (e.target === document.getElementById('confirm-backdrop')) closeConfirm(); // click outside
  });
  document.addEventListener('keydown', (e) => {
    const backdrop = document.getElementById('confirm-backdrop');
    if (backdrop.hidden) return;
    if (e.key === 'Escape') { closeConfirm(); return; }
    if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); document.getElementById('confirm-ok').click(); return; }
    if (e.key === 'Tab') { // trap focus between the two buttons
      const btns = backdrop.querySelectorAll('button');
      if (btns.length < 2) return;
      const first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ── tabs ───────────────────────────────────────── */
  function moveTabIndicator() {
    const active = document.querySelector('.kds-tab.active');
    const ind = document.getElementById('tab-indicator');
    if (!active || !ind) return;
    ind.style.left = active.offsetLeft + 'px';
    ind.style.width = active.offsetWidth + 'px';
    /* 2-axis motion: squeeze (narrow+short) mid-flight → overshoot on landing → settle */
    ind.animate([
      { transform: 'scale(1, 1)' },
      { transform: 'scale(0.82, 0.85)', offset: 0.45 },
      { transform: 'scale(1.08, 1.18)', offset: 0.85 },
      { transform: 'scale(1, 1)' },
    ], { duration: 340, easing: 'ease-in-out' });
  }
  document.querySelectorAll('.kds-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      tab = btn.dataset.tab;
      document.querySelectorAll('.kds-tab').forEach(b => b.classList.toggle('active', b === btn));
      render();
      moveTabIndicator();
    });
  });

  /* ── card colour panel (generated from COLOR_GROUPS + PALETTE) ──
     Accordion groups: each group is a toggle head + collapsible body.
     One group open at a time — the full 8-colour editor stays reachable
     without the wall of controls the panel used to show. */
  function buildColorPanel() {
    const root = document.getElementById('color-panel');
    root.innerHTML = COLOR_GROUPS.map(g => `
      <button type="button" class="kds-acc-head" aria-expanded="false">
        <span>${g.title}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="kds-acc-body" hidden>
        ${g.keys.map(k => `
          <div class="kds-color-group">
            <div class="kds-color-head">
              <label for="hex-${k.key}">${k.label}</label>
              <input type="color" class="kds-native" id="native-${k.key}" data-key="${k.key}" value="${colors[k.key]}" aria-label="${k.label} colour picker">
              <input class="kds-hex-input" id="hex-${k.key}" data-key="${k.key}" spellcheck="false" aria-label="${k.label} hex">
            </div>
            <div class="kds-swatches" data-key="${k.key}"></div>
          </div>
        `).join('')}
      </div>
    `).join('');
    /* accordion: opening one group closes the others */
    root.querySelectorAll('.kds-acc-head').forEach(head => {
      head.addEventListener('click', () => {
        const wasOpen = head.getAttribute('aria-expanded') === 'true';
        root.querySelectorAll('.kds-acc-head').forEach(h => {
          h.setAttribute('aria-expanded', 'false');
          h.nextElementSibling.hidden = true;
        });
        if (!wasOpen) {
          head.setAttribute('aria-expanded', 'true');
          head.nextElementSibling.hidden = false;
        }
      });
    });
    /* hex inputs: apply on Enter/blur if valid */
    root.querySelectorAll('.kds-hex-input').forEach(input => {
      const apply = () => {
        const v = input.value.trim();
        if (/^#?[0-9a-fA-F]{6}$/.test(v)) {
          pickColor(input.dataset.key, '#' + v.replace('#', '').toLowerCase());
        } else if (/^#?[0-9a-fA-F]{3}$/.test(v)) {
          const h = v.replace('#', '').split('').map(c => c + c).join('');
          pickColor(input.dataset.key, '#' + h.toLowerCase());
        } else {
          input.value = colors[input.dataset.key]; // revert invalid
        }
      };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
      input.addEventListener('blur', apply);
    });
    /* native colour picker: live update on input */
    root.querySelectorAll('.kds-native').forEach(native => {
      native.addEventListener('input', (e) => pickColor(e.target.dataset.key, e.target.value));
    });
    /* sync hex/native inputs to the active config — buildColorPanel can
       run on a theme switch, where every input is created fresh */
    COLOR_GROUPS.forEach(g => g.keys.forEach(k => syncColorRow(k.key)));
  }
  function buildSwatches() {
    COLOR_GROUPS.forEach(g => g.keys.forEach(k => {
      const el = document.querySelector(`.kds-swatches[data-key="${k.key}"]`);
      if (!el) return;
      el.innerHTML = PALETTE.map(s =>
        `<button type="button" class="kds-swatch${colors[k.key] === s ? ' active' : ''}" style="background:${s}" data-swatch="${s}" title="${s}" aria-label="${k.label}: ${s}" onclick="pickColor('${k.key}', '${s}')"></button>`
      ).join('');
    }));
  }
  function syncColorRow(key) {
    const hex = document.getElementById('hex-' + key);
    if (hex && document.activeElement !== hex) hex.value = colors[key];
    const native = document.getElementById('native-' + key);
    if (native) native.value = colors[key];
  }
  function pickColor(key, value) {
    colors = { ...colors, [key]: value };
    colorConfigs[currentTheme()] = colors; // write back to THIS theme's slot
    saveColorConfigs();
    syncColorRow(key);
    buildSwatches();
    render();
  }

  function toggleMenu(force) {
    const panel = document.getElementById('hamburger-panel');
    const btn = document.getElementById('hamburger-btn');
    const showing = force !== undefined ? force : panel.style.display !== 'block';
    panel.style.display = showing ? 'block' : 'none';
    panel.setAttribute('aria-hidden', String(!showing));
    btn.setAttribute('aria-expanded', showing);
    if (showing) {
      /* focus trap: keep Tab cycling inside the panel */
      panel._lastFocus = document.activeElement;
      panel.querySelector('.kds-panel-close').focus();
      /* indicator offsets are only valid once the panel is visible */
      moveThemeIndicator();
    } else if (panel._lastFocus) {
      panel._lastFocus.focus();
      panel._lastFocus = null;
    }
  }
  document.getElementById('hamburger-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMenu();
  });
  /* close hamburger on outside click.
     Use composedPath(), not panel.contains(e.target): clicking a swatch
     calls pickColor() → buildSwatches() which REPLACES the swatch DOM
     mid-click, detaching e.target from the panel. contains() then
     returns false and the menu wrongly closes. composedPath() captures
     the ancestor chain at dispatch time, before any DOM mutation. */
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('hamburger-panel');
    const btn = document.getElementById('hamburger-btn');
    const path = e.composedPath ? e.composedPath() : [];
    const inside = path.includes(panel) || path.includes(btn);
    if (!inside) toggleMenu(false);
  });
  /* close hamburger + filter on Escape */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      toggleMenu(false);
      toggleFilterPanel(false);
      return;
    }
    /* Tab focus trap while the hamburger panel is open */
    const panel = document.getElementById('hamburger-panel');
    if (e.key === 'Tab' && panel.style.display === 'block') {
      const focusables = panel.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])');
      if (focusables.length === 0) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  document.getElementById('panel-close').addEventListener('click', () => toggleMenu(false));

  /* ── page zoom (global, like Ctrl+/Ctrl-) ─────── */
  const PAGEZOOM_KEY = 'kds-proto-pagezoom';
  let pageZoom = loadPageZoom();
  function loadPageZoom() {
    try { const v = parseInt(localStorage.getItem(PAGEZOOM_KEY), 10); if (!isNaN(v)) return v; } catch {}
    return 100;
  }
  function savePageZoom() { try { localStorage.setItem(PAGEZOOM_KEY, String(pageZoom)); } catch {} }
  function applyPageZoom() {
    /* zoom the whole screen — behaves like browser Ctrl+/-
       NOTE: the CSS `zoom` property is Chrome/Safari-only; acceptable
       for the KDS tablet target (see review P5). */
    document.getElementById('screen').style.zoom = pageZoom === 100 ? '' : pageZoom / 100;
    document.getElementById('pagezoom-value').textContent = pageZoom + '%';
  }
  document.getElementById('pagezoom-out').addEventListener('click', () => {
    pageZoom = Math.max(75, pageZoom - 10); savePageZoom(); applyPageZoom();
  });
  document.getElementById('pagezoom-in').addEventListener('click', () => {
    pageZoom = Math.min(150, pageZoom + 10); savePageZoom(); applyPageZoom();
  });
  document.getElementById('pagezoom-value').addEventListener('click', () => {
    pageZoom = 100; savePageZoom(); applyPageZoom();
  });
  applyPageZoom();

  /* ── card size zoom (cards only) ──────────────── */
  function applyZoom() {
    document.getElementById('main').style.zoom = zoom === 100 ? '' : zoom / 100;
    document.getElementById('zoom-value').textContent = zoom + '%';
  }
  document.getElementById('zoom-out').addEventListener('click', () => {
    zoom = Math.max(75, zoom - 10); saveZoom(); applyZoom();
  });
  document.getElementById('zoom-in').addEventListener('click', () => {
    zoom = Math.min(150, zoom + 10); saveZoom(); applyZoom();
  });
  /* clicking the % value resets to 100% */
  document.getElementById('zoom-value').addEventListener('click', () => {
    zoom = 100; saveZoom(); applyZoom();
  });
  applyZoom();

  /* ── kitchen switches (sound / auto-accept / animations) ──
     sound + ack persist the preference but have no observable effect
     yet: the prototype has no live order-arrival simulation to act on
     (deferred — see review P5). */
  const KITCHEN_KEY = 'kds-proto-kitchen';
  function loadKitchen() {
    try {
      const raw = localStorage.getItem(KITCHEN_KEY);
      if (raw) return { sound: true, ack: false, anim: true, ...JSON.parse(raw) };
    } catch {}
    return { sound: true, ack: false, anim: true };
  }
  function saveKitchen() { try { localStorage.setItem(KITCHEN_KEY, JSON.stringify(kitchen)); } catch {} }
  let kitchen = loadKitchen();
  function applyKitchen() {
    ['sound', 'ack', 'anim'].forEach(k => {
      const el = document.getElementById('toggle-' + k);
      if (!el) return;
      const on = kitchen[k] === true;
      el.classList.toggle('on', on);
      el.setAttribute('aria-checked', on);
    });
    /* global reduced-motion class: kills all CSS animations/transitions */
    document.body.classList.toggle('no-anim', kitchen.anim !== true);
  }
  document.getElementById('toggle-sound').addEventListener('click', () => { kitchen.sound = !kitchen.sound; saveKitchen(); applyKitchen(); });
  document.getElementById('toggle-ack').addEventListener('click', () => { kitchen.ack = !kitchen.ack; saveKitchen(); applyKitchen(); });
  document.getElementById('toggle-anim').addEventListener('click', () => { kitchen.anim = !kitchen.anim; saveKitchen(); applyKitchen(); });
  applyKitchen();

  /* scoped reset — colours only, for the CURRENT theme, with a styled
     confirm modal since it is the one irreversible-ish action in the panel */
  document.getElementById('reset-colors').addEventListener('click', () => {
    const th = currentTheme();
    confirmModal('Reset ' + th + ' theme card colours to the defaults?', 'Reset', () => {
      colors = { ...DEFAULT_COLORS };
      colorConfigs[th] = colors;
      saveColorConfigs();
      COLOR_GROUPS.forEach(g => g.keys.forEach(k => syncColorRow(k.key)));
      buildSwatches();
      render();
    }, true);
  });

  /* ── shift toggle ───────────────────────────────── */
  let shiftOn = false;
  document.getElementById('shift-btn').addEventListener('click', (e) => {
    shiftOn = !shiftOn;
    const btn = document.getElementById('shift-btn');
    /* swap which stacked label is visible — width stays the same */
    btn.querySelectorAll('span').forEach((s, i) => s.classList.toggle('visible', shiftOn ? i === 1 : i === 0));
    btn.classList.toggle('is-active', shiftOn);
  });

  /* ── theme toggle (light/dark) ──────────────────── */
  function moveThemeIndicator() {
    const on = document.querySelector('.kds-theme-option.on');
    const ind = document.getElementById('theme-indicator');
    if (!on || !ind) return;
    ind.style.left = on.offsetLeft + 'px';
    ind.style.width = on.offsetWidth + 'px';
    /* same squash-and-stretch as the tab slider */
    ind.animate([
      { transform: 'scale(1, 1)' },
      { transform: 'scale(0.82, 0.85)', offset: 0.45 },
      { transform: 'scale(1.08, 1.18)', offset: 0.85 },
      { transform: 'scale(1, 1)' },
    ], { duration: 340, easing: 'ease-in-out' });
  }
  function updateThemeTag() {
    const tag = document.getElementById('theme-tag');
    if (tag) tag.textContent = currentTheme();
  }
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const isLight = document.getElementById('screen').classList.toggle('light');
    try { localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark'); } catch {}
    document.querySelectorAll('.kds-theme-option').forEach(o =>
      o.classList.toggle('on', o.dataset.theme === (isLight ? 'light' : 'dark')));
    moveThemeIndicator();
    /* per-theme colours: swap to the other config, refresh panel + board */
    colors = colorConfigs[currentTheme()];
    updateThemeTag();
    buildColorPanel();
    buildSwatches();
    render();
  });
  moveThemeIndicator();
  updateThemeTag();

  /* ── live clock in footer ───────────────────────── */
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' +
      now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(tick, 1000);
  tick();

  /* Live durations WITHOUT re-rendering: update the elapsed text on
     each card in place. Re-rendering the whole board every N seconds
     was destroying mid-animation cards (leaving/spawn/FLIP), so cards
     must never be rebuilt just to refresh a timer. */
  function tickCardTimers() {
    const cards = document.querySelectorAll('.kds-card[data-received]');
    const now = Date.now();
    cards.forEach(card => {
      const received = Number(card.dataset.received);
      if (!received) return;
      const el = card.querySelector('.kds-card-header-meta .time');
      if (el) el.textContent =
        new Date(received).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) +
        ' · ' + fmtDuration(now - received);
    });
  }
  setInterval(tickCardTimers, 1000);
  buildColorPanel();
  buildSwatches();
  render();
  /* measure the tab pill AFTER the first render: the count badge starts
     as '0' in the static HTML, so measuring earlier would lock the blue
     pill to the too-narrow pre-render width (only corrected by a later
     tab switch). */
  moveTabIndicator();

  /* Recompute columns when the window resizes — the column count is
     derived from width, so a resize (e.g. 1024px → different columns)
     must re-render. Debounced so dragging the window edge doesn't spam. */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!leaveLock) render(); // wait out any card leave animation
    }, 150);
  });
</script>
</body>
</html>
