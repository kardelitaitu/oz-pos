[package]
name = "oz-reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Analytics and CSV export engine for OZ-POS — daily summaries, sales reports, inventory movement."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
oz-core = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
prometheus = { version = "0.14", optional = true, features = ["process"] }

[features]
default = []
metrics = ["dep:prometheus"]
