[package]
name = "oz-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OZ-POS OpenAPI REST server — axum-based HTTP API with JWT auth."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
oz-core = { workspace = true }
rusqlite = { workspace = true }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
foundation = { workspace = true }
# Phase 1.2 (unify-auth-and-sync.md): the cloud server's Postgres branch
# passes a pool through `AppState` so REST handlers can read/write Postgres.
tokio-postgres = { version = "0.7" }
deadpool-postgres = { version = "0.14" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
http-body-util = "0.1"
serde_json = { workspace = true }
