[package]
name = "oz-pos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Proprietary"
description = "Fuzz testing targets for OZ-POS critical parsing and arithmetic paths"

[package.metadata]
cargo-fuzz = true

# The fuzz crate is a standalone cargo-fuzz workspace (it depends on
# workspace crates by path but must NOT be a member of the root
# workspace, which would make cargo-fuzz fail with "current package
# believes it's in a workspace when it's not").
[workspace]

# Feature flags for C-heavy dependencies.
#
# oz-core and oz-plugin both bring in bundled SQLite (rusqlite) via C code.
# When the fuzz workspace became standalone (no longer inheriting root workspace
# profile overrides), SQLite's C initialization started conflicting with
# libFuzzer's signal-handler setup on Linux, producing a deadly-signal exit-77
# on the very first (empty-bytes) iteration of lightweight targets like
# sku_parse.
#
# Gate them behind opt-in features so each fuzz binary only links the C deps
# it actually needs:
#
#   (default)           - foundation + oz-lua only; covers sku_parse,
#                         money_parse (no C-lib initialization conflicts).
#   oz-core-fuzz        - adds oz-core + bundled SQLite; needed for cart_deser.
#   oz-plugin-fuzz      - adds oz-plugin (implies oz-core-fuzz); needed for
#                         ozpkg_parse + manifest_parse.
#   lua-fuzz            - enables lua_sandbox (oz-lua already in base deps).
[features]
oz-core-fuzz   = ["dep:oz-core", "dep:serde_json"]
oz-plugin-fuzz = ["oz-core-fuzz", "dep:oz-plugin", "dep:toml"]
lua-fuzz       = []

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
foundation = { path = "../foundation" }
oz-lua = { path = "../crates/oz-lua" }
oz-core   = { path = "../crates/oz-core",   optional = true }
oz-plugin = { path = "../crates/oz-plugin", optional = true }
rlua = "0.20"
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }

[[bin]]
name = "sku_parse"
path = "fuzz_targets/sku_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "money_parse"
path = "fuzz_targets/money_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cart_deser"
path = "fuzz_targets/cart_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lua_sandbox"
path = "fuzz_targets/lua_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ozpkg_parse"
path = "fuzz_targets/ozpkg_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false
