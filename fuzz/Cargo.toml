[package]
name = "oz-pos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Proprietary"
description = "Fuzz testing targets for OZ-POS critical parsing and arithmetic paths"

[package.metadata]
cargo-fuzz = true

# The fuzz crate is a standalone cargo-fuzz workspace (it depends on
# workspace crates by path but must NOT be a member of the root
# workspace, which would make cargo-fuzz fail with "current package
# believes it's in a workspace when it's not").
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
foundation = { path = "../foundation" }
oz-core = { path = "../crates/oz-core" }
oz-lua = { path = "../crates/oz-lua" }
oz-plugin = { path = "../crates/oz-plugin" }
rlua = "0.20"
serde_json = "1"
toml = "0.8"

[[bin]]
name = "sku_parse"
path = "fuzz_targets/sku_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "money_parse"
path = "fuzz_targets/money_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cart_deser"
path = "fuzz_targets/cart_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lua_sandbox"
path = "fuzz_targets/lua_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ozpkg_parse"
path = "fuzz_targets/ozpkg_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false
